<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Square · CPV Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  /* ── Solar Square brand palette ── */
  --ss-navy:   #1A237E;   /* deep navy — primary brand */
  --ss-navy-2: #283593;   /* slightly lighter navy */
  --ss-amber:  #F5A623;   /* signature amber/gold */
  --ss-amber-2:#FFC84A;   /* lighter amber */
  --ss-sky:    #EEF4FB;   /* light sky background */
  --ss-sky-2:  #DDEAF8;   /* slightly deeper sky */
  --ss-sky-3:  #C9DDEF;   /* border / divider */

  /* ── Semantic aliases ── */
  --bg:        var(--ss-sky);
  --bg-2:      var(--ss-sky-2);
  --bg-3:      var(--ss-sky-3);
  --ink:       #0D1B3E;
  --ink-2:     #2C3E6B;
  --ink-3:     #6278A0;
  --ink-4:     #9AAAC4;
  --line:      #D4E1F0;
  --line-2:    #B8CCE4;
  --accent:    var(--ss-navy);
  --accent-2:  var(--ss-navy-2);
  --accent-soft:#DDE5F8;
  --warn:      var(--ss-amber);
  --warn-soft: #FFF3D0;
  --danger:    #D63031;
  --danger-soft:#FDEAEB;
  --good:      #00897B;
  --good-soft: #C8F0EC;
  --b2b:       #5E35B1;
  --b2b-soft:  #EDE7F6;
  --maxw:1380px;
}

html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
body{font-size:14px;line-height:1.5}

/* ── TOP NAVBAR (Solar Square style) ── */
.ss-topnav{
  background:var(--ss-navy);
  padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;
  height:56px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(26,35,126,.25);
}
.ss-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.ss-logo-icon{width:auto;height:40px;object-fit:contain}
.ss-logo-text{display:flex;flex-direction:column;line-height:1.05}
.ss-logo-text .l1{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em}
.ss-logo-text .l2{font-size:10px;font-weight:500;color:var(--ss-amber);letter-spacing:.08em;text-transform:uppercase}
.ss-nav-title{color:rgba(255,255,255,.7);font-size:13px;font-weight:500;letter-spacing:.02em}
.ss-nav-badge{background:var(--ss-amber);color:var(--ss-navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 28px 80px}

/* ── HEADER UNDER NAV ── */
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 0 20px;border-bottom:2px solid var(--ss-amber);margin-bottom:28px}
.top-left .eye{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ss-amber);margin-bottom:6px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0;color:var(--ss-navy)}
.top h1 em{font-style:normal;color:var(--ss-amber)}
.top .meta{text-align:right;font-size:11.5px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;padding-top:4px}
.top .meta .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle;box-shadow:0 0 0 3px rgba(0,137,123,.2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(0,137,123,.2)}50%{box-shadow:0 0 0 7px rgba(0,137,123,.05)}}
.top .meta .dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(245,166,35,.2);animation:none}

/* ── TABS (amber underline style) ── */
.tabs{display:flex;gap:0;margin-top:16px;border-bottom:2px solid var(--line);width:fit-content}
.tab{padding:9px 18px;font-size:12.5px;font-weight:600;color:var(--ink-3);background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:inherit;letter-spacing:.02em;text-transform:uppercase;transition:all .15s}
.tab.active{color:var(--ss-navy);border-bottom-color:var(--ss-amber)}
.tab:hover:not(.active){color:var(--ss-navy-2)}

/* ── MONTH SELECTOR (pill style, sits above the view tabs) ── */
.month-tabs{display:flex;gap:6px;margin-top:14px;width:fit-content;background:var(--ss-sky-2);padding:4px;border-radius:9px}
.month-tab{padding:6px 16px;font-size:12px;font-weight:700;color:var(--ink-3);background:transparent;border:0;border-radius:6px;cursor:pointer;font-family:inherit;letter-spacing:.03em;text-transform:uppercase;transition:all .15s}
.month-tab.active{color:#fff;background:var(--ss-navy);box-shadow:0 1px 4px rgba(26,35,126,.25)}
.month-tab:hover:not(.active){color:var(--ss-navy)}
.month-tab:disabled{opacity:.4;cursor:not-allowed}

/* ── EYE (section label) ── */
.eye{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ss-amber);margin-bottom:4px}

/* ── HERO KPIs ── */
.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:40px;box-shadow:0 2px 8px rgba(26,35,126,.06)}
.hero-pm{margin-bottom:14px}
.hero .stat.headline-blue{background:var(--ss-sky);color:var(--ss-navy)}
.hero .stat.headline-blue .lbl{color:var(--accent)}
.hero .stat.headline-blue .val{color:var(--ss-navy)}
.hero .stat.headline-blue .sub{color:var(--ink-3)}
.hero .stat{padding:24px 20px;border-right:1px solid var(--line);background:#fff;position:relative;cursor:default;transition:background .15s}
.hero .stat:last-child{border-right:0}
.hero .stat:hover{background:var(--ss-sky)}
.hero .stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.hero .stat .val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ss-navy)}
.hero .stat .val .cur{font-size:20px;font-weight:600;color:var(--ss-amber);margin-right:2px}
.hero .stat .val .unit{font-size:14px;color:var(--ink-3);font-weight:400;margin-left:3px}
.hero .stat .sub{margin-top:10px;font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.hero .stat .sub b{color:var(--ink-2);font-weight:600}
.hero .stat.headline{background:var(--ss-navy)}
.hero .stat.headline .lbl{color:var(--ss-amber)}
.hero .stat.headline .val{color:#fff}
.hero .stat.headline .val .cur{color:var(--ss-amber)}
.hero .stat.headline .sub{color:rgba(255,255,255,.6)}
.hero .stat.headline .sub b{color:#fff}

/* ── SECTIONS ── */
.section{margin:44px 0 0}
.section h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px;color:var(--ss-navy)}
.section .lead{font-size:13px;color:var(--ink-3);margin-bottom:24px;max-width:680px;line-height:1.65}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:stretch}
.grid-2-eq{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* ── CARD ── */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 1px 4px rgba(26,35,126,.05)}
.card h3{font-size:13.5px;font-weight:700;margin:0 0 3px;color:var(--ss-navy);letter-spacing:-.005em}
.card .desc{font-size:11.5px;color:var(--ink-3);margin-bottom:18px;line-height:1.5}
.chart-box{position:relative;height:280px}

/* ── COST TILE ── */
.cost-tile{padding:16px 18px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(26,35,126,.04)}
.cost-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ss-amber)}
.cost-tile .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:600;margin-bottom:6px;margin-top:4px}
.cost-tile .val{font-size:19px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;color:var(--ss-navy)}
.cost-tile .pct{font-size:11px;color:var(--ink-3);margin-top:5px;font-family:'JetBrains Mono',monospace}
.cost-tile .bar-track{margin-top:10px;height:4px;background:var(--bg-2);border-radius:2px;overflow:hidden}
.cost-tile .bar-track > i{display:block;height:100%;border-radius:2px}

/* ── STACKED BAR ── */
.stack{display:flex;height:44px;border-radius:8px;overflow:hidden;background:var(--bg-2);margin:8px 0 16px}
.stack > div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:0;transition:opacity .15s;cursor:default}
.stack > div:hover{opacity:.82}
.stack-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2);margin-top:12px}
.stack-legend .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ── RANK LIST ── */
.rank-list{display:flex;flex-direction:column;gap:7px}
.rank-item{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:12px;padding:9px 13px;border-radius:8px;background:var(--bg-2);font-size:13px;transition:background .12s;border-left:3px solid transparent}
.rank-item:hover{background:var(--bg-3)}
.rank-item .pos{font-family:'JetBrains Mono',monospace;color:var(--ink-3);font-size:10.5px}
.rank-item .name{font-weight:600;color:var(--ink)}
.rank-item .val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ss-navy)}
.rank-item .val .unit{color:var(--ink-3);font-weight:400;font-size:11px;margin-left:2px}
.rank-item.bad{background:linear-gradient(90deg,var(--danger-soft) 0%,transparent 70%);border-left-color:var(--danger)}
.rank-item.good{background:linear-gradient(90deg,var(--good-soft) 0%,transparent 70%);border-left-color:var(--good)}

/* ── TABLE ── */
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(26,35,126,.05)}
.tbl-head{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:var(--ss-navy)}
.tbl-head h3{margin:0;font-size:14px;font-weight:700;color:#fff}
.tbl-head .controls{display:flex;gap:8px;align-items:center}
.search{padding:7px 11px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-family:inherit;width:200px;outline:none;transition:all .15s}
.search:focus{border-color:var(--ss-amber);box-shadow:0 0 0 3px rgba(245,166,35,.2)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
thead th{text-align:right;padding:11px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700;background:var(--ss-sky-2);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;transition:color .12s}
thead th:first-child{text-align:left}
thead th:hover{color:var(--ss-navy)}
thead th.sorted{color:var(--ss-navy);font-weight:800}
thead th.sorted::after{content:" ↓"}
thead th.sorted.asc::after{content:" ↑"}
tbody td{padding:10px 13px;text-align:right;border-bottom:1px solid var(--line);color:var(--ink-2)}
tbody td:first-child{text-align:left;color:var(--ink);font-weight:600}
tbody tr:hover{background:var(--ss-sky)}
tbody tr:last-child td{border-bottom:0}
.barcell{position:relative;display:inline-block;width:60px;height:5px;background:var(--bg-2);border-radius:3px;margin-left:8px;vertical-align:middle;overflow:hidden}
.barcell > i{display:block;height:100%;background:var(--ss-navy);border-radius:3px}
.chip{display:inline-block;padding:2px 8px;font-size:10.5px;border-radius:4px;font-weight:600;letter-spacing:.02em}
.chip.b2b{background:var(--b2b-soft);color:var(--b2b)}
.chip.warn{background:var(--warn-soft);color:#7a5000}
.chip.good{background:var(--good-soft);color:#004D45}
.chip.bad{background:var(--danger-soft);color:#991B1B}

/* ── SH TABLE ── */
.sh-tbl{width:max-content;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.sh-tbl thead th{position:sticky;top:0;z-index:2;background:var(--ss-sky-2);padding:8px 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.sh-tbl thead th.sticky-l{z-index:4}
.sh-tbl thead th.day-h.hl{background:rgba(245,166,35,.2);color:var(--ss-navy)}
.sh-tbl tbody td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sh-tbl tbody td.sticky-l{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
.sh-tbl tbody td.day-c{min-width:30px;color:var(--ink-4)}
.sh-tbl tbody td.day-c.has{background:var(--good-soft);color:#004D45;font-weight:600}
.sh-tbl tbody td.day-c.hl{background:rgba(245,166,35,.15);color:var(--ss-navy);font-weight:600}
.sh-tbl tbody td.day-c.has.hl{background:rgba(245,166,35,.3);color:#6B3A00}
.sh-tbl tbody tr:hover td{background:var(--ss-sky)}
.sh-tbl tbody tr:hover td.sticky-l{background:var(--ss-sky) !important}
.sh-tbl tbody tr:hover td.day-c.has{background:#9FE0D8}

/* ── SECTION DIVIDER ── */
.ss-divider{height:3px;background:linear-gradient(90deg,var(--ss-amber) 0%,var(--ss-navy) 100%);border-radius:2px;margin:40px 0 0}

/* ── FOOTER ── */
.foot{margin-top:60px;padding:20px 0 0;border-top:2px solid var(--ss-amber);font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace}
.foot strong{color:var(--ss-navy)}

/* ── LOADING ── */
.loading{padding:60px;text-align:center;color:var(--ink-3);font-size:14px}
.loading .spin{display:inline-block;width:20px;height:20px;border:2px solid var(--bg-2);border-top-color:var(--ss-amber);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FILTER BAR ── */
.filter-bar select,.filter-bar input{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--ss-amber);box-shadow:0 0 0 3px rgba(245,166,35,.2)}

/* ── DEEP DIVE / CITY IQ ── */
.sh-profile-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(26,35,126,.06)}
.sh-profile-card .sh-name{font-size:22px;font-weight:800;color:var(--ss-navy);letter-spacing:-.02em;margin:0 0 4px}
.sh-profile-card .sh-meta{font-size:12px;color:var(--ink-3);margin-bottom:18px}
.kpi-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
.kpi-mini{padding:14px 16px;border-radius:8px;background:var(--bg-2);border-left:3px solid var(--ss-amber)}
.kpi-mini .k-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.kpi-mini .k-val{font-size:20px;font-weight:700;color:var(--ss-navy);font-variant-numeric:tabular-nums}
.kpi-mini .k-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.day-spark{display:flex;gap:2px;align-items:flex-end;height:48px;margin-top:12px}
.day-spark .bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;background:var(--ss-navy);opacity:.7;transition:opacity .1s}
.day-spark .bar:hover{opacity:1}
.rating-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.02em}
.rating-pill.star{background:var(--good-soft);color:var(--good)}
.rating-pill.ok{background:var(--warn-soft);color:#7a5000}
.rating-pill.needs{background:var(--danger-soft);color:var(--danger)}

/* City IQ */
.city-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 2px 8px rgba(26,35,126,.06);margin-bottom:20px}
.city-card h3{font-size:16px;font-weight:800;color:var(--ss-navy);margin:0 0 4px}
.city-card .city-meta{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.factor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.factor-chip{padding:10px 14px;border-radius:8px;background:var(--bg-2);font-size:12px}
.factor-chip .f-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.factor-chip .f-val{font-weight:700;color:var(--ink)}
.factor-chip.pos{background:var(--good-soft);border-left:3px solid var(--good)}
.factor-chip.neg{background:var(--danger-soft);border-left:3px solid var(--danger)}
.factor-chip.neu{background:var(--bg-2);border-left:3px solid var(--line)}
.ai-insight{background:linear-gradient(135deg,var(--accent-soft) 0%,#EDF1FC 100%);border:1px solid var(--line-2);border-radius:10px;padding:18px 20px;margin-top:16px;font-size:13px;color:var(--ink-2);line-height:1.7}
.ai-insight .ai-icon{font-size:16px;margin-right:8px}
.ai-insight strong{color:var(--ss-navy)}
.ai-loading{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;padding:16px}
.ai-loading .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--bg-3);border-top-color:var(--ss-amber);border-radius:50%;animation:spin .7s linear infinite}

@media (max-width:1100px){
  .hero{grid-template-columns:repeat(3,1fr)}
  .hero .stat:nth-child(3){border-right:0}
  .grid-6{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .hero{grid-template-columns:repeat(2,1fr)}
  .hero .stat{border-right:0;border-bottom:1px solid var(--line)}
  .grid-2,.grid-2-eq,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr}
  .wrap{padding:16px 14px 60px}
  .ss-topnav{padding:0 14px}
}
</style>
</head>
<body>

<script>
// ═════════════════════════════════════════════════════════════════════════════
// CONFIGURATION
// ═════════════════════════════════════════════════════════════════════════════
// Paste your Apps Script web app URL here after deploying WebApp.gs.
// Until you do, the dashboard renders from embedded sample data.
// Paste your Apps Script web app URLs here after deploying WebApp.gs — one per month.
// Until you do, the dashboard renders from embedded sample data.
const MONTH_URLS = {
  july: "https://script.google.com/macros/s/AKfycbw1kvdQFbjLmGepQvUAL4vBUW21kAMohO98Hzegyw9pLngnpGlV1nathvmq6bwhEpeS/exec",
  august:"https://script.google.com/macros/s/AKfycbwdg3hFKOTriQCzp7V_cMwCu_yESFJxUcGm-Qh0-nyJyFjYf7uXDm2-Y70iMhi4eLv4/exec"
};
let currentMonthKey = "august";
const WEB_APP_URL = MONTH_URLS[currentMonthKey];   // ← kept for backward-compat with any code referencing it

// ═════════════════════════════════════════════════════════════════════════════
// EMBEDDED FALLBACK (so preview works before web app is deployed)
// ═════════════════════════════════════════════════════════════════════════════
// (embedded June fallback dataset removed — dashboard is live-only)
// ═════════════════════════════════════════════════════════════════════════════
// FETCH + RENDER
// ═════════════════════════════════════════════════════════════════════════════
let DATA = null;
const dataCache = {}; // month key -> loaded payload, so re-switching doesn't refetch

async function loadData(monthKey) {
  monthKey = monthKey || currentMonthKey;
  const url = MONTH_URLS[monthKey];

  if (dataCache[monthKey]) {
    DATA = dataCache[monthKey];
    setStatus("LIVE", "as of " + (DATA.meta && DATA.meta.asOf ? new Date(DATA.meta.asOf).toLocaleString() : "now"), false);
    return true;
  }

  if (!url) {
    DATA = null;
    setStatus("NOT CONFIGURED", "no web app URL for " + monthKey, true);
    return false;
  }

  // Apps Script cold-starts can take 30s+ and throws occasional 429/500s,
  // so give each attempt a long timeout and retry with backoff.
  const ATTEMPTS = 3, TIMEOUT_MS = 60000, BACKOFF = [1500, 4000];
  let lastErr = null;

  for (let attempt = 1; attempt <= ATTEMPTS; attempt++) {
    setStatus(attempt === 1 ? "LOADING…" : "RETRYING…",
              attempt === 1 ? "fetching from sheet (can take up to a minute)"
                            : "attempt " + attempt + " of " + ATTEMPTS, false);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url + "?cb=" + Date.now(), { redirect: "follow", signal: ctrl.signal, cache: "no-store" });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status + (res.status === 429 ? " (rate limited)" : ""));
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (_) { throw new Error(/<html/i.test(text) ? "got an HTML page, not JSON — check deployment access" : "invalid JSON response"); }
      if (json.error) throw new Error(json.error);
      DATA = json;
      dataCache[monthKey] = json;
      setStatus("LIVE", "as of " + (json.meta && json.meta.asOf ? new Date(json.meta.asOf).toLocaleString() : "now")
                        + (attempt > 1 ? " · loaded on attempt " + attempt : ""), false);
      return true;
    } catch (e) {
      clearTimeout(timer);
      lastErr = (e && e.name === "AbortError") ? new Error("timed out after " + (TIMEOUT_MS / 1000) + "s") : e;
      console.warn("loadData attempt " + attempt + " failed:", lastErr.message);
      if (attempt < ATTEMPTS) await new Promise(r => setTimeout(r, BACKOFF[attempt - 1]));
    }
  }

  DATA = null;
  lastLoadError = lastErr && lastErr.message ? lastErr.message : "unknown error";
  setStatus("OFFLINE", "failed after " + ATTEMPTS + " attempts — " + lastLoadError, true);
  return false;
}

let lastLoadError = "";

async function retryLoad(monthKey) {
  document.getElementById("app").innerHTML = `<div class="loading"><span class="spin"></span>Loading data…</div>`;
  const ok = await loadData(monthKey);
  if (!ok) { showLoadError(monthKey); return; }
  renderHeader();
  destroyCharts();
  RENDER[currentTab]();
}

function showLoadError(monthKey) {
  document.getElementById("app").innerHTML =
    '<div class="loading" style="flex-direction:column;gap:12px;text-align:center">' +
    '<div style="font-weight:600;font-size:15px">Could not load ' + monthKey + ' data</div>' +
    '<div style="font-size:12px;opacity:.75;max-width:460px;line-height:1.6">' +
      (lastLoadError ? 'Error: <code>' + lastLoadError + '</code><br>' : '') +
      'The Apps Script web app did not respond in time. This is usually a slow cold start \u2014 retrying often works.' +
    '</div>' +
    '<button id="retry-btn" class="month-tab" style="cursor:pointer">Retry now</button>' +
    '</div>';
  const b = document.getElementById("retry-btn");
  if (b) b.addEventListener("click", () => retryLoad(monthKey));
}


function setStatus(text, detail, isOffline) {
  document.getElementById("status-dot").classList.toggle("off", !!isOffline);
  document.getElementById("status-text").textContent = text;
  document.getElementById("status-detail").textContent = detail;
}

// ═════════════════════════════════════════════════════════════════════════════
// FORMATTERS
// ═════════════════════════════════════════════════════════════════════════════
const inr = n => new Intl.NumberFormat("en-IN").format(Math.round(n));
const inrShort = n => {
  n = +n || 0;
  if (n >= 1e7) return (n / 1e7).toFixed(2) + " Cr";
  if (n >= 1e5) return (n / 1e5).toFixed(2) + " L";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + " K";
  return inr(n);
};
const pct = (a, b) => (b ? (a / b * 100).toFixed(1) : "0") + "%";
const round = (n, d=0) => +(+n || 0).toFixed(d);

// ── NEW HIRE COST (NHC) ───────────────────────────────────────────────
// Emitted by WebApp.gs as `newHireCost` on each cluster and on totals.
// Logic (mirrors CPV Automation calcNewHireCost): 14-day window from DOJ
// (DOJ..DOJ+13) overlapping the payload month, full salary, no proration,
// excluded if the SH exited within 10 days of joining.
// Every reader below degrades to 0 / "—" when the field is absent, so the
// dashboard keeps working against an un-patched web app.
const NHC_KEYS   = ["newHireCost", "newHiringCost"];   // v2.9 name, v2.8 name
const nhcOf      = o => { if (!o) return 0; for (const k of NHC_KEYS) if (+o[k]) return +o[k]; return 0; };
// present-and-zero is NOT the same as absent: ₹0 means "no new hires this
// month", absent means WebApp.gs hasn't been patched yet.
const nhcHas     = o => !!(o && NHC_KEYS.some(k => Object.prototype.hasOwnProperty.call(o, k)));
const nhcLive    = () => nhcHas(DATA.totals) || (DATA.clusters||[]).some(nhcHas) || (DATA.shLevel||[]).some(nhcHas);
const nhcPerSH   = () => (DATA.shLevel||[]).some(nhcHas);
// per-SH lookup for views that don't carry shLevel rows (e.g. Deep Dive)
function nhcSHIndex() {
  if (DATA.__nhcSH) return DATA.__nhcSH;
  const byCode = {}, byName = {};
  (DATA.shLevel||[]).forEach(r => {
    if (!nhcHas(r)) return;
    const code = String(r.empCode||"").trim();
    const name = String(r.name||"").trim().toLowerCase().replace(/\s+/g," ");
    if (code) byCode[code] = +r.newHireCost || 0;
    if (name) byName[name] = +r.newHireCost || 0;
  });
  DATA.__nhcSH = { byCode, byName };
  return DATA.__nhcSH;
}
function nhcForSH(empCode, name) {
  const ix = nhcSHIndex();
  const code = String(empCode||"").trim();
  if (code && ix.byCode.hasOwnProperty(code)) return ix.byCode[code];
  const n = String(name||"").trim().toLowerCase().replace(/\s+/g," ");
  return n && ix.byName.hasOwnProperty(n) ? ix.byName[n] : 0;
}
const totalsNHC  = () => nhcOf(DATA.totals) || (DATA.clusters||[]).reduce((s,c)=>s+nhcOf(c),0);
const hasNHC     = () => totalsNHC() > 0;
// NHC per visit — how many rupees of each visit's cost is new-hire spend
const nhcCpvOf   = (nhc, visits) => (visits > 0 ? nhc / visits : 0);
// The sheet now ships its own "New Hire CPV" column (= cost ÷ adjusted
// visits). Prefer it so the dashboard always agrees with Visits Analysis
// View; fall back to computing only when the field isn't there.
const nhcCpvSheet = o => (o && o.newHireCpv !== undefined && o.newHireCpv !== null && o.newHireCpv !== "") ? +o.newHireCpv : null;
const nhcCpvBest  = (o, nhc, visits) => { const s = nhcCpvSheet(o); return s !== null ? s : nhcCpvOf(nhc, visits); };
const fmtNhcCpv  = (nhc, visits) => (visits > 0 && nhc > 0 ? "\u20B9" + inr(Math.round(nhc / visits)) : "\u2014");

// ── MONTH PROGRESS + PM PROJECTION ────────────────────────────────────
// Elapsed days come from meta.asOf (the sheet's own as-of date), so the
// projection matches the data rather than the viewer's clock.
function monthProgress() {
  const dim = DATA.meta && DATA.meta.daysInMonth ? +DATA.meta.daysInMonth : 30;
  let elapsed = dim;
  const asOf = DATA.meta && DATA.meta.asOf ? new Date(DATA.meta.asOf) : null;
  if (asOf && !isNaN(asOf.getTime())) elapsed = asOf.getDate();
  elapsed = Math.max(1, Math.min(elapsed, dim));
  return { daysInMonth: dim, elapsed: elapsed, remaining: Math.max(0, dim - elapsed) };
}

// Projects month-end PM completion from the run rate achieved so far.
function pmProjection(due, done) {
  const mp = monthProgress();
  due = +due || 0; done = +done || 0;
  const perDay      = done / mp.elapsed;                       // PM per calendar day so far
  const projected   = done + perDay * mp.remaining;            // where the month lands
  const projPending = Math.max(0, due - projected);            // PM still open at month end
  const balance     = Math.max(0, due - done);
  const reqPerDay   = mp.remaining > 0 ? balance / mp.remaining : (balance > 0 ? Infinity : 0);
  const gapPerDay   = reqPerDay === Infinity ? Infinity : reqPerDay - perDay;
  return {
    ...mp, due, done, perDay, projected, projPending, balance, reqPerDay, gapPerDay,
    projPct   : due > 0 ? projected / due * 100 : 0,
    donePct   : due > 0 ? done / due * 100 : 0,
    onTrack   : projPending <= 0 && due > 0,
    // how much the rate must lift, e.g. 1.35 = needs 35% more per day
    liftNeeded: perDay > 0 && reqPerDay !== Infinity ? reqPerDay / perDay : null,
  };
}

// ── DOJ / System Days helpers ────────────────────────────────────────────────
const DOJ_MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function parseDojDate(s) {
  if (!s) return null;
  const str = String(s).trim();
  let m = str.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if (m && DOJ_MONTHS[m[2]] !== undefined) return new Date(+m[3], DOJ_MONTHS[m[2]], +m[1]);
  m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
function systemDaysFromDoj(dojStr) {
  const d = parseDojDate(dojStr);
  if (!d) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  const diff = Math.round((today - d) / 86400000);
  return diff >= 0 ? diff + 1 : diff; // day of joining counts as day 1
}

function renderTblBody() {
  const tbody = document.getElementById("tbody");

    activeShB2C: Math.max(...DATA.clusters.map(c => c.activeShB2C || 0), 1),
    totalCost:   Math.max(...DATA.clusters.map(c => c.totalCost || 0), 1),

    totalVisits: Math.max(...DATA.clusters.map(c => c.totalVisits || 0), 1),
  };

  // precompute NHC per visit so the column sorts like any other key
  DATA.clusters.forEach(c => { c.nhcCpv = Math.round(nhcCpvBest(c, nhcOf(c), c.totalVisits || 0)); });

  const filtered = DATA.clusters.filter(c => c.cluster.toLowerCase().includes(tblState.q));
  filtered.sort((a, b) => {
    let va = a[tblState.sort], vb = b[tblState.sort];
    if (typeof va === "string") return tblState.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    va = +va || 0; vb = +vb || 0;
    return tblState.asc ? va - vb : vb - va;

  const bar = (v, m, color) => v > 0 ? `<span class="barcell"><i style="width:${(v/m*100).toFixed(1)}%;background:${color||'var(--accent)'}"></i></span>` : "";

      <td>${(c.vDayPM||0).toFixed(2)}</td>
      <td>${(c.vDayBlended||0).toFixed(2)}</td>
      <td>${c.cpvPM > 0 ? "₹" + inr(c.cpvPM) : "—"}</td>
      <td>${c.cpvBlended > 0 ? `<span class="chip ${cpvClass}">₹${inr(c.cpvBlended)}</span>` : "—"}</td>
    </tr>`;
  }).join("");

  // ── Totals row ────────────────────────────────────────────────────────
  const sum = k => filtered.reduce((s,c) => s + (c[k]||0), 0);
  const tCost = sum('totalCost'), tCostPM = sum('costPM');
  const tPmTm = sum('pmTmAdj'), tTvAdj = sum('tvAdj');
  const tManDays = sum('manDays'), tPmManDays = sum('pmManDays'), tPmDone = sum('pmDone');
  const cpvPM = tPmTm ? Math.round(tCostPM / tPmTm) : 0;
  const cpvBld = tTvAdj ? Math.round(tCost / tTvAdj) : 0;

  const vdayBld = tManDays ? (sum('totalVisits') / tManDays) : 0;

    <td>${inr(sum('totalVisits'))}</td>
    <td>${inr(sum('pmDone'))}</td>
    <td>${inr(sum('cm'))}</td>
    <td>₹${inrShort(sum('salaryCost'))}</td>
    <td>₹${inrShort(sum('reimbCost'))}</td>
    <td>₹${inrShort(sum('toolkitCost'))}</td>
    <td>₹${inrShort(sum('schedulerCost'))}</td>
    <td>₹${inrShort(sum('bikeCost'))}</td>
    <td>₹${inr(tCost)}</td>
    <td>${(() => { const n = filtered.reduce((a,c)=>a+nhcOf(c),0); return n > 0 ? "₹" + inrShort(n) : "—"; })()}</td>
    <td>${(() => {
      const t = nhcCpvSheet(DATA.totals);
      if (t !== null && filtered.length === DATA.clusters.length) return "₹" + inr(Math.round(t));

      const d = sum('tvAdj') || sum('totalVisits');    // sheet divides by adjusted visits
      return n > 0 && d > 0 ? "₹" + inr(Math.round(n/d)) : "—";

    <td>${vdayPM.toFixed(2)}</td>

    <td>₹${inr(cpvPM)}</td>

    th.classList.toggle("sorted", th.dataset.k === tblState.sort);

  });
}

function redrawSH() {
  const rows = DATA.shDailyUnified || [];
  const daysInMonth = DATA.meta.daysInMonth || 30;
  const types = DATA.meta.types || ['PM','CM','MAAS','B2B','Torque'];
  const st = shState;
  const from = Math.max(1, Math.min(st.dateFrom, daysInMonth));
  const to = Math.max(from, Math.min(st.dateTo, daysInMonth));

  // get a person's per-day array for the selected type (or summed for All)
  const dayArr = (r) => {
    if (st.type === 'All') {
      const a = new Array(daysInMonth).fill(0);
      Object.keys(r.typeDays || {}).forEach(t => {
        r.typeDays[t].forEach((v,i) => { if (i < daysInMonth) a[i] += v; });
      });
      return a;
    }
    return (r.typeDays && r.typeDays[st.type]) ? r.typeDays[st.type].slice(0, daysInMonth) : new Array(daysInMonth).fill(0);
  };

  let filtered = rows
    .filter(r => st.cluster === 'all' || r.cluster === st.cluster)
    .filter(r => !st.name || r.name.toLowerCase().includes(st.name.toLowerCase().trim()))
    .map(r => {
      const arr = dayArr(r);
      const windowTotal = arr.slice(from-1, to).reduce((s,v)=>s+v, 0);
      return { ...r, _arr: arr, _win: windowTotal };
    })
    .filter(r => r._win > 0);

  filtered.sort((a,b) => b._win - a._win);

  const totalVisits = filtered.reduce((s,r)=>s+r._win, 0);
  const activeShs = filtered.length;
  const avgPerSH = activeShs ? (totalVisits/activeShs).toFixed(1) : '0';
  const dayTotals = new Array(daysInMonth).fill(0);
  filtered.forEach(r => r._arr.forEach((v,i)=>{ if(i>=from-1 && i<to) dayTotals[i]+=v; }));
  let peakDay = from, peakVal = 0;
  for (let i=from-1;i<to;i++){ if(dayTotals[i]>peakVal){peakVal=dayTotals[i];peakDay=i+1;} }

  // Monthly Avg (constant) — full-month total visits of this type ÷ SH count (ignores filters)
  const allRows = DATA.shDailyUnified || [];
  const monthRows = allRows.filter(r => st.cluster === 'all' || r.cluster === st.cluster);
  let monthVisits = 0, monthSHs = 0;
  monthRows.forEach(r => {
    let mv = 0;
    if (st.type === 'All') { Object.keys(r.totByType||{}).forEach(t => mv += r.totByType[t]); }
    else { mv = (r.totByType && r.totByType[st.type]) ? r.totByType[st.type] : 0; }
    if (mv > 0) { monthVisits += mv; monthSHs++; }
  });
  const monthlyAvg = monthSHs ? (monthVisits/monthSHs).toFixed(1) : '0';

  // Daily Visits/Day — visits in window ÷ distinct active days (≥1 visit of ANY type), averaged across shown SHs
  // Build an any-type per-day array per SH so the denominator counts every day he worked.
  const anyTypeDays = (r) => {
    const a = new Array(daysInMonth).fill(0);
    Object.keys(r.typeDays || {}).forEach(t => {
      r.typeDays[t].forEach((v,i) => { if (i < daysInMonth) a[i] += v; });
    });
    return a;
  };
  let perDayVals = [];
  filtered.forEach(r => {
    const anyArr = anyTypeDays(r);
    let activeDays = 0;
    for (let i=from-1;i<to;i++) if ((anyArr[i]||0) > 0) activeDays++;
    if (activeDays > 0) perDayVals.push(r._win / activeDays);
  });
  const dailyPerDay = perDayVals.length ? (perDayVals.reduce((a,b)=>a+b,0)/perDayVals.length).toFixed(1) : '0';

  document.getElementById('sh-summary').textContent =
    `${activeShs} SHs · ${inr(totalVisits)} ${st.type} visits · days ${from}–${to}${st.cluster!=='all'?' · '+st.cluster:''}`;

  document.getElementById('sh-kpi').innerHTML = `
    <div class="grid-4" style="margin-bottom:10px">

function renderDDResults(rows) {
  const container = document.getElementById('dd-results');

    const total = r.total || 0;
    const pm = r.pm || 0;

    const secondary = r.secondary || 0;
    const vPerDay = daysActive > 0 ? (total / daysActive).toFixed(1) : 0;
    const pmPct = total > 0 ? ((pm / total) * 100).toFixed(0) : 0;

    // Find cluster data for context
    const clusterData = DATA.clusters.find(c => c.cluster === r.cluster) || {};
    const clusterCpvPM = clusterData.cpvPM || 0;

    const clusterAvgVDay = clusterData.vDayPM || T.vDayPM || 5;

    let rating, ratingClass, ratingEmoji;

    else if (daysActive >= 5) { rating = 'Needs Improvement'; ratingClass = 'needs'; ratingEmoji = '⚠️'; }
    else { rating = 'Insufficient Data'; ratingClass = 'ok'; ratingEmoji = '📋'; }

    }).join('');

    // Weekend/rest days count (days with 0)

    return `

              <span style="margin-left:8px">${r.type || 'SSE'}</span>
            </div>

          <div>
            <span class="rating-pill ${ratingClass}">${ratingEmoji} ${rating}</span>
          </div>
        </div>

        <div class="kpi-band">
          <div class="kpi-mini">
            <div class="k-lbl">Total Visits MTD</div>
            <div class="k-val">${inr(total)}</div>
            <div class="k-sub">Primary + Secondary</div>
          </div>
          <div class="kpi-mini">
            <div class="k-lbl">PM / CM</div>
            <div class="k-val">${pm} / ${cm}</div>
            <div class="k-sub">${pmPct}% PM</div>
          </div>
          <div class="kpi-mini">
            <div class="k-lbl">Visits / Active Day</div>
            <div class="k-val">${vPerDay}</div>
            <div class="k-sub">Cluster avg: ${clusterAvgVDay.toFixed(1)}</div>
          </div>
          <div class="kpi-mini">
            <div class="k-lbl">Days Active</div>
            <div class="k-val">${daysActive}</div>
            <div class="k-sub">${zeroDays} zero-visit days</div>

          <div class="kpi-mini">

            <div class="k-sub">${total > 0 ? ((secondary/total)*100).toFixed(0) : 0}% of total</div>
          </div>
          ${(() => {
            if (!nhcPerSH()) return '';
            const own = nhcForSH(r.empCode, r.name);

            return `
          <div class="kpi-mini" style="background:var(--warn-soft,#FEF9EC)">

          <div class="day-spark">${sparkBars}</div>

            <span style="color:#10B981">■ 8+ visits (great day)</span>

function generateSHInsight(sh, cluster, T) {
  const total = sh.total || 0;
  const daysActive = sh.daysActive || 1;
  const vPerDay = total / daysActive;
  const clusterAvg = cluster.vDayPM || T.vDayPM || 5;
  const pm = sh.pm || 0;
  const cm = sh.cm || 0;
  const secondary = sh.secondary || 0;

  const parts = [];

  // Productivity vs cluster
  if (vPerDay >= clusterAvg * 1.1) {
    parts.push(`<strong>${sh.name.split(' ')[0]}</strong> is performing <strong>above cluster average</strong> at ${vPerDay.toFixed(1)} visits/day vs cluster avg of ${clusterAvg.toFixed(1)}.`);
  } else if (vPerDay < clusterAvg * 0.75) {
    parts.push(`<strong>${sh.name.split(' ')[0]}</strong> is <strong>below cluster average</strong> (${vPerDay.toFixed(1)} vs ${clusterAvg.toFixed(1)} v/day) — check scheduling and route density.`);
  } else {
    parts.push(`<strong>${sh.name.split(' ')[0]}</strong> is tracking close to the cluster average of ${clusterAvg.toFixed(1)} visits/day.`);
  }

  // Secondary visits
  if (secondary > total * 0.3) {
    parts.push(` High secondary visit share (${((secondary/total)*100).toFixed(0)}%) — may indicate they're covering multiple areas or supporting other SHs.`);
  }

  // CM heavy
  if (cm > pm && total > 10) {
    parts.push(` More CM than PM visits — this SH may be primarily allocated to corrective maintenance.`);
  }

  // Consistency check
  const days = sh.days || [];
  const nonZero = days.filter(v => v > 0);
  const avg = nonZero.length ? nonZero.reduce((a,b)=>a+b,0)/nonZero.length : 0;
  const variance = nonZero.reduce((s,v) => s + Math.pow(v - avg, 2), 0) / Math.max(nonZero.length, 1);
  if (Math.sqrt(variance) > avg * 0.4 && total > 20) {
    parts.push(` Visit counts show <strong>high day-to-day variance</strong> — inconsistent scheduling or demand spikes.`);
  } else if (total > 30) {
    parts.push(` Day-to-day visit pattern is <strong>consistent</strong> — good scheduling discipline.`);
  }

  return parts.join('') || 'Insufficient visit data to generate insights. Check if SH data is complete for this month.';
}

function ciWindowTotal(c, type, from, to) {
  var arr = (type === 'All') ? c.byDay : (c.byTypeDay && c.byTypeDay[type] ? c.byTypeDay[type] : null);
  if (!arr) return 0;
  var s = 0;
  for (var i = from-1; i < to && i < arr.length; i++) s += arr[i] || 0;
  return s;
}

// merge per-cluster cost/manDays for pro-rated metrics
function ciClusterMeta(cluster) {
  return (DATA.clusters || []).find(function(c){ return c.cluster === cluster; }) || {};
}

function redrawCityIQ() {
  const st = cityIQState;
  const daysInMonth = DATA.meta.daysInMonth || 30;
  const from = Math.max(1, Math.min(st.from, daysInMonth));
  const to   = Math.max(from, Math.min(st.to, daysInMonth));
  const winDays   = to - from + 1;
  const frac      = winDays / daysInMonth;
  const cityData  = DATA.cityDaily || [];
  const unified   = DATA.shDailyUnified || [];
  const types     = DATA.meta.types || ['PM','CM','MAAS','B2B','Torque'];

  // ── helpers ────────────────────────────────────────────────────────────────
  const winArr = (arr) => { let s=0; for(let i=from-1;i<to&&i<arr.length;i++) s+=arr[i]||0; return s; };

  function buildCity(c) {
    const meta = ciClusterMeta(c.cluster);
    const arr  = (st.type==='All') ? c.byDay : (c.byTypeDay&&c.byTypeDay[st.type]?c.byTypeDay[st.type]:[]);

    // visits in window
    const visits = winArr(arr);

    // per-SH data
    const shData = unified.filter(r => r.cluster === c.cluster).map(r => {
      let v = 0;
      Object.keys(r.typeDays||{}).forEach(t => {
        if (st.type!=='All' && t!==st.type) return;
        for (let i=from-1;i<to;i++) v += r.typeDays[t][i]||0;
      });
      return v;
    }).filter(v => v > 0);

    const shs     = shData.length;
    const vday    = shs > 0 ? shData.reduce((a,b)=>a+b,0) / shs : 0;

    // daily points for sparkline
    const spark = [];
    for (let i=from-1;i<to&&i<arr.length;i++) spark.push(arr[i]||0);

    // consistency: % of window days with ≥1 visit
    const activeDays = spark.filter(v=>v>0).length;
    const cons   = winDays > 0 ? Math.round(activeDays/winDays*100) : 0;

    // peak day
    const peak = spark.length ? Math.max(...spark) : 0;

    // vis / cal day
    const visPerDay = winDays ? visits/winDays : 0;

    // cpv
    const cost = (meta.totalCost||0) * frac;
    const cpv  = visits > 0 ? Math.round(cost/visits) : 0;

    // new hire cost — prorated to the same window as cost, then per visit
    const nhc    = nhcOf(meta) * frac;
    const nhcCpv = visits > 0 ? Math.round(nhc/visits) : 0;

    // pm%
    let pmV = 0;
    if (c.byTypeDay && c.byTypeDay['PM']) {
      for (let i=from-1;i<to&&i<c.byTypeDay['PM'].length;i++) pmV += c.byTypeDay['PM'][i]||0;
    }
    const pmPct = visits > 0 ? Math.round(pmV/visits*100) : 0;

    return { cluster:c.cluster, visits, shs, vday, visPerDay, cpv, peak, cons, pmPct, spark, cost, nhc, nhcCpv };
  }

  const allCities = cityData.map(buildCity).filter(c => c.visits > 0);
  if (!allCities.length) {
    document.getElementById('ci-body').innerHTML = '<p style="color:var(--ink-3);padding:20px">No visit data for this selection.</p>';
    return;
  }

  // medians for benchmarking
  const med = arr => { const s=[...arr].sort((a,b)=>a-b); return s[Math.floor(s.length/2)]||0; };
  const medVday = med(allCities.map(c=>c.vday));
  const medCpv  = med(allCities.filter(c=>c.cpv>0).map(c=>c.cpv));
  const medCons = med(allCities.map(c=>c.cons));
  const maxVisits = Math.max(...allCities.map(c=>c.visits),1);
  const maxVday   = Math.max(...allCities.map(c=>c.vday),1);
  const maxCpv    = Math.max(...allCities.filter(c=>c.cpv>0).map(c=>c.cpv),1);
  const maxNhcCpv = Math.max(...allCities.map(c=>c.nhcCpv||0),1);

  if (st.selected === 'ALL') {
    // ── CITY CARD GRID ────────────────────────────────────────────────────

    // sort state persisted on the state object
    if (!st.sortKey) st.sortKey = 'visits';
    if (st.sortAsc === undefined) st.sortAsc = false;

    const sortBtns = [
      { k:'visits',    label:'Visits' },
      { k:'vday',      label:'V/Day' },
      { k:'cpv',       label:'CPV' },
      { k:'cons',      label:'Consistency' },
      { k:'shs',       label:'SHs' },
      { k:'pmPct',     label:'PM%' },
      { k:'visPerDay', label:'Vis/Day' },
      { k:'peak',      label:'Peak Day' },
      { k:'nhcCpv',    label:'NHC/Visit' },
    ];

    const totalVisits = allCities.reduce((s,c)=>s+c.visits,0);
    const avgVday = allCities.reduce((s,c)=>s+c.vday,0)/Math.max(allCities.length,1);
    const totCost = allCities.reduce((s,c)=>s+c.cost,0);
    const avgCpv  = totalVisits>0 ? Math.round(totCost/totalVisits) : 0;
    const avgCons = allCities.reduce((s,c)=>s+c.cons,0)/Math.max(allCities.length,1);

    const sortBtnHtml = sortBtns.map(b =>
      `<button class="ci-sort-btn${st.sortKey===b.k?' active':''}" data-k="${b.k}"
        style="padding:5px 13px;border:1px solid ${st.sortKey===b.k?'var(--ss-navy)':'var(--line)'};border-radius:20px;
               background:${st.sortKey===b.k?'var(--ss-navy)':'#fff'};
               color:${st.sortKey===b.k?'#fff':'var(--ink-3)'};
               font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">
        ${b.label}${st.sortKey===b.k?(st.sortAsc?' ↑':' ↓'):''}
      </button>`
    ).join('');

    document.getElementById('ci-summary').textContent =
      `${allCities.length} cities · ${inr(totalVisits)} ${st.type} visits · days ${from}–${to} (${winDays}d)`;

    function renderCards() {
      const sorted = [...allCities].sort((a,b) => {
        const va=a[st.sortKey]||0, vb=b[st.sortKey]||0;
        return st.sortAsc ? va-vb : vb-va;
      });

      // Benchmark strip at top
      const benchHtml = `
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px">
          <div class="cost-tile" style="flex:1;min-width:160px"><div class="lbl">Median V/Day</div><div class="val">${medVday.toFixed(1)}</div><div class="pct">across ${allCities.length} cities</div></div>
          <div class="cost-tile" style="flex:1;min-width:160px"><div class="lbl">Avg CPV (window)</div><div class="val">₹${inr(avgCpv)}</div><div class="pct">median ₹${inr(medCpv)}</div></div>
          <div class="cost-tile" style="flex:1;min-width:160px"><div class="lbl">Avg consistency</div><div class="val">${Math.round(avgCons)}%</div><div class="pct">median ${medCons}%</div></div>
          <div class="cost-tile" style="flex:1;min-width:160px"><div class="lbl">Total visits</div><div class="val">${inr(totalVisits)}</div><div class="pct">${st.type} · days ${from}–${to}</div></div>
          ${(() => {
            const totNhc = allCities.reduce((s,c)=>s+c.nhc,0);
            const avgNhcCpv = totalVisits > 0 ? Math.round(totNhc/totalVisits) : 0;
            return `<div class="cost-tile" style="flex:1;min-width:160px"><div class="lbl">Avg NHC / visit</div><div class="val">${totNhc>0?'₹'+inr(avgNhcCpv):'—'}</div><div class="pct">${totNhc>0?'₹'+inrShort(totNhc)+' new-hire cost':'needs newHireCost in payload'}</div></div>`;
          })()}
        </div>`;

      const cardsHtml = sorted.map((c, rank) => {
        const cpvGood    = c.cpv > 0 && c.cpv < medCpv * 0.85;
        const cpvBad     = c.cpv > 0 && c.cpv > medCpv * 1.2;
        const vdayGood   = c.vday > medVday * 1.1;
        const vdayBad    = c.vday < medVday * 0.8 && c.shs > 0;
        const consGood   = c.cons >= 80;
        const consBad    = c.cons < 50;

        // signal badges
        const badges = [
          vdayGood  ? `<span style="background:var(--good-soft);color:var(--good);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">↑ V/Day</span>` : '',
          vdayBad   ? `<span style="background:var(--danger-soft);color:var(--danger);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">↓ V/Day</span>` : '',
          cpvGood   ? `<span style="background:var(--good-soft);color:var(--good);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">↓ CPV</span>` : '',
          cpvBad    ? `<span style="background:var(--danger-soft);color:var(--danger);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">↑ CPV</span>` : '',
          consGood  ? `<span style="background:var(--good-soft);color:var(--good);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">Consistent</span>` : '',
          consBad   ? `<span style="background:var(--warn-soft);color:#7a5000;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">Spotty</span>` : '',
        ].filter(Boolean).join(' ');

        // sparkline — mini inline SVG
        const spMax = Math.max(...c.spark, 1);
        const spW = 80, spH = 28;
        const spPts = c.spark.map((v,i) => {
          const x = c.spark.length > 1 ? Math.round(i/(c.spark.length-1)*(spW-2))+1 : spW/2;
          const y = spH - Math.round((v/spMax)*(spH-4)) - 2;
          return `${x},${y}`;
        }).join(' ');
        const sparkSvg = `<svg width="${spW}" height="${spH}" style="overflow:visible">
          <polyline points="${spPts}" fill="none" stroke="var(--ss-navy)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
          ${c.spark.map((v,i)=>{
            if(v===0) return '';
            const x = c.spark.length>1 ? Math.round(i/(c.spark.length-1)*(spW-2))+1 : spW/2;
            const y = spH - Math.round((v/spMax)*(spH-4)) - 2;
            return `<circle cx="${x}" cy="${y}" r="2" fill="var(--ss-amber)" opacity="${v===spMax?1:0.4}"/>`;
          }).join('')}
        </svg>`;

        // 5 metric bars inside the card
        const metricBar = (val, max, color) => {
          const w = max>0 ? Math.round(val/max*100) : 0;
          return `<div style="height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden;margin-top:3px"><i style="display:block;height:100%;width:${w}%;background:${color};border-radius:2px"></i></div>`;
        };

        const rankLabel = rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`#${rank+1}`;

        return `
          <div class="ci-card" data-city="${c.cluster}"
            style="background:#fff;border:1.5px solid ${st.selected===c.cluster?'var(--ss-amber)':'var(--line)'};
                   border-radius:12px;padding:18px 20px;cursor:pointer;transition:all .15s;
                   box-shadow:0 1px 4px rgba(26,35,126,.05)">
            <!-- header row -->
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
              <div>
                <div style="font-size:16px;font-weight:800;color:var(--ss-navy);line-height:1.1">${c.cluster}</div>
                <div style="font-size:11px;color:var(--ink-3);margin-top:3px">${c.shs} SH${c.shs!==1?'s':''} · ${inr(c.visits)} visits</div>
              </div>
              <div style="font-size:13px;font-weight:700;color:var(--ink-3)">${rankLabel}</div>
            </div>

            <!-- signal badges -->
            ${badges ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">${badges}</div>` : ''}

            <!-- sparkline + peak -->
            <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px">
              <div>${sparkSvg}</div>
              <div style="text-align:right">
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">Peak day</div>
                <div style="font-size:15px;font-weight:700;color:var(--ss-navy)">${inr(c.peak)}</div>
              </div>
            </div>

            <!-- 6 metrics grid -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 14px">

              <div>
                <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">V/Day</div>
                <div style="font-size:17px;font-weight:700;color:${vdayGood?'var(--good)':vdayBad?'var(--danger)':'var(--ink)'}">${c.vday.toFixed(1)}</div>
                ${metricBar(c.vday, maxVday, vdayGood?'var(--good)':vdayBad?'var(--danger)':'var(--accent)')}
              </div>

              <div>
                <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">CPV</div>
                <div style="font-size:17px;font-weight:700;color:${cpvGood?'var(--good)':cpvBad?'var(--danger)':'var(--ink)'}">${c.cpv>0?'₹'+inr(c.cpv):'—'}</div>
                ${c.cpv>0 ? metricBar(maxCpv-c.cpv, maxCpv, cpvGood?'var(--good)':cpvBad?'var(--danger)':'var(--accent)') : ''}
              </div>

              <div>
                <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">Consistency</div>
                <div style="font-size:17px;font-weight:700;color:${consGood?'var(--good)':consBad?'var(--danger)':'var(--ink)'}">${c.cons}%</div>
                ${metricBar(c.cons, 100, consGood?'var(--good)':consBad?'var(--danger)':'var(--accent)')}
              </div>

              <div>
                <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">Vis/CalDay</div>
                <div style="font-size:17px;font-weight:700;color:var(--ink)">${c.visPerDay.toFixed(1)}</div>
                ${metricBar(c.visits, maxVisits, 'var(--accent)')}
              </div>

              ${st.type==='All' ? `
              <div>
                <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">PM%</div>
                <div style="font-size:17px;font-weight:700;color:var(--ink)">${c.pmPct}%</div>
                ${metricBar(c.pmPct, 100, 'var(--ss-navy)')}
              </div>` : ''}

              <div>
                <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">Volume</div>
                <div style="font-size:17px;font-weight:700;color:var(--ink)">${inr(c.visits)}</div>
                ${metricBar(c.visits, maxVisits, 'var(--ss-amber)')}
              </div>

              ${c.nhc > 0 ? `
              <div>
                <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">NHC / Visit</div>
                <div style="font-size:17px;font-weight:700;color:${c.nhcCpv > maxNhcCpv*0.6 ? 'var(--warn)' : 'var(--ink)'}">₹${inr(c.nhcCpv)}</div>
                ${metricBar(c.nhcCpv, maxNhcCpv, 'var(--ss-amber)')}
              </div>` : ''}

            </div>

            <div style="margin-top:12px;font-size:10.5px;color:var(--ink-4);border-top:1px solid var(--line);padding-top:8px">
              Tap for city detail →
            </div>
          </div>`;
      }).join('');

      document.getElementById('ci-card-area').innerHTML = benchHtml +
        `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px">${cardsHtml}</div>`;

      // click → city drill-down
      document.querySelectorAll('.ci-card').forEach(card => {
        card.addEventListener('mouseenter', () => { card.style.borderColor='var(--ss-amber)'; card.style.transform='translateY(-2px)'; card.style.boxShadow='0 4px 16px rgba(26,35,126,.12)'; });
        card.addEventListener('mouseleave', () => { card.style.borderColor='var(--line)'; card.style.transform=''; card.style.boxShadow='0 1px 4px rgba(26,35,126,.05)'; });
        card.addEventListener('click', () => {
          cityIQState.selected = card.dataset.city;
          document.getElementById('ci-city').value = card.dataset.city;
          redrawCityIQ();
        });
      });
    }

    document.getElementById('ci-body').innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center">
        <span style="font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em">Sort by</span>
        ${sortBtnHtml}
      </div>
      <div id="ci-card-area"></div>
    `;

    // sort button listeners
    document.querySelectorAll('.ci-sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.k;
        if (st.sortKey === k) st.sortAsc = !st.sortAsc;
        else { st.sortKey = k; st.sortAsc = false; }
        // re-render just the cards area + update button states
        document.querySelectorAll('.ci-sort-btn').forEach(b => {
          const active = b.dataset.k === st.sortKey;
          b.style.background = active ? 'var(--ss-navy)' : '#fff';
          b.style.color      = active ? '#fff' : 'var(--ink-3)';
          b.style.borderColor= active ? 'var(--ss-navy)' : 'var(--line)';
          b.textContent = sortBtns.find(s=>s.k===b.dataset.k).label + (active?(st.sortAsc?' ↑':' ↓'):'');
        });
        renderCards();
      });
    });

    renderCards();

  } else {
    // ── SINGLE CITY DEEP DIVE ────────────────────────────────────────────────
    const c = cityData.find(x => x.cluster === st.selected);
    if (!c) { document.getElementById('ci-body').innerHTML = '<p style="color:var(--ink-3)">No data.</p>'; return; }

    const meta = ciClusterMeta(st.selected);
    const cityMetrics = allCities.find(x => x.cluster === st.selected) || buildCity(c);

    const arr = (st.type==='All') ? c.byDay : (c.byTypeDay&&c.byTypeDay[st.type]?c.byTypeDay[st.type]:new Array(daysInMonth).fill(0));
    const dayPoints = [];
    for (let d=from; d<=to; d++) dayPoints.push({ day:d, v:arr[d-1]||0 });
    const total = dayPoints.reduce((s,d)=>s+d.v,0);
    const maxV  = Math.max(...dayPoints.map(d=>d.v),1);
    let   peak  = dayPoints.reduce((a,d)=>d.v>a.v?d:a, dayPoints[0]||{day:from,v:0});

    // SH present per day
    const shPresent = {};
    unified.filter(r=>r.cluster===st.selected).forEach(r => {
      for (let i=from-1;i<to;i++) {
        let v=0;
        Object.keys(r.typeDays||{}).forEach(t=>{
          if(st.type!=='All'&&t!==st.type) return;
          v+=(r.typeDays[t][i]||0);
        });
        if(v>0) shPresent[i+1]=(shPresent[i+1]||0)+1;
      }
    });

    // type mix
    const typeBreak = types.map(t=>({ t, v:ciWindowTotal(c,t,from,to) })).filter(x=>x.v>0);

    // per-SH breakdown — enrich with team/category from shLevel
    const shLevelMap = {};
    (DATA.shLevel||[]).forEach(r=>{ if(!shLevelMap[r.empCode||r.name]) shLevelMap[r.empCode||r.name] = r; });
    const shRows = unified.filter(r=>r.cluster===st.selected).map(r=>{
      let v=0;
      Object.keys(r.typeDays||{}).forEach(t=>{
        if(st.type!=='All'&&t!==st.type) return;
        for(let i=from-1;i<to;i++) v+=(r.typeDays[t][i]||0);
      });
      // attended days = days in window with >=1 visit of the selected type
      let att=0;
      for(let i=from-1;i<to;i++){
        let dv=0;
        Object.keys(r.typeDays||{}).forEach(t=>{
          if(st.type!=='All'&&t!==st.type) return;
          dv+=(r.typeDays[t][i]||0);
        });
        if(dv>0) att++;
      }
      const meta = shLevelMap[r.empCode] || shLevelMap[r.name] || {};
      return { name:r.name, empCode:r.empCode, visits:v, attDays:att, vPerAtt: att? v/att : 0,
               team:meta.team||'—', category:meta.category||'—', status:meta.status||'—',
               doj:meta.doj||meta.DOJ||meta.finalDoj||'' };
    }).filter(r=>r.visits>0).sort((a,b)=>b.visits-a.visits);

    const maxSH = shRows.length ? shRows[0].visits : 1;

    document.getElementById('ci-summary').textContent =
      `${st.selected} · ${inr(total)} ${st.type} visits · days ${from}–${to}`;

    // back button hint
    const backBtn = `<button onclick="cityIQState.selected='ALL';document.getElementById('ci-city').value='ALL';redrawCityIQ()"
      style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;
             background:#fff;color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:20px">
      ← All cities
    </button>`;

    // 8 KPI cards in a single row
    const kpis = [
      { lbl:'Visits', val:inr(total),                  sub:`days ${from}–${to}`,             col:'var(--ss-navy)' },
      { lbl:'SHs active', val:cityMetrics.shs,          sub:'with ≥1 visit',                 col:'var(--ink)' },
      { lbl:'V/Day', val:cityMetrics.vday.toFixed(1),   sub:'visits ÷ active SHs',           col: cityMetrics.vday>medVday*1.1?'var(--good)':cityMetrics.vday<medVday*0.8?'var(--danger)':'var(--ink)' },
      { lbl:'Vis/CalDay', val:cityMetrics.visPerDay.toFixed(1), sub:'avg calendar day',       col:'var(--ink)' },
      { lbl:'CPV*', val:cityMetrics.cpv>0?'₹'+inr(cityMetrics.cpv):'—', sub:'pro-rated',     col: cityMetrics.cpv>0&&cityMetrics.cpv<medCpv*0.85?'var(--good)':cityMetrics.cpv>medCpv*1.2?'var(--danger)':'var(--ink)' },
      { lbl:'Consistency', val:cityMetrics.cons+'%',    sub:'days with ≥1 visit',             col: cityMetrics.cons>=80?'var(--good)':cityMetrics.cons<50?'var(--danger)':'var(--ink)' },
      { lbl:'Peak day', val:inr(cityMetrics.peak),      sub:`day ${peak.day}`,               col:'var(--ink)' },
      { lbl:'PM%', val:st.type==='All'?cityMetrics.pmPct+'%':'—', sub:'of window visits',    col:'var(--ink)' },
    ].map(k=>`<div class="cost-tile" style="flex:1;min-width:130px">
      <div class="lbl">${k.lbl}</div>
      <div class="val" style="color:${k.col}">${k.val}</div>
      <div class="pct">${k.sub}</div>
    </div>`).join('');

    // type mix pills
    const typeColors = {PM:'var(--accent)',CM:'var(--good)',MAAS:'var(--warn)',B2B:'var(--b2b)',Torque:'var(--ink-3)'};
    const typePills = typeBreak.map(x=>{
      const pv = total ? Math.round(x.v/total*100) : 0;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px">
        <div style="width:40px;height:${Math.max(8,Math.round(pv*1.2))}px;background:${typeColors[x.t]||'var(--ink-3)'};border-radius:4px 4px 0 0;transition:height .3s"></div>
        <div style="font-size:13px;font-weight:700;color:var(--ink)">${inr(x.v)}</div>
        <div style="font-size:10px;color:var(--ink-3)">${x.t}</div>
        <div style="font-size:10px;color:var(--ink-4)">${pv}%</div>
      </div>`;
    }).join('');

    // daily bars with SH underlay
    const bars = dayPoints.map(d => {
      const shP = shPresent[d.day]||0;
      const h   = Math.max(2, Math.round(d.v/maxV*140));
      const isP = d.v === peak.v && d.v > 0;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:14px;cursor:default"
               title="Day ${d.day}: ${d.v} visits · ${shP} SHs">
        <div style="font-size:8px;color:var(--ink-3);height:12px;display:flex;align-items:center">${d.v||''}</div>
        <div style="width:100%;border-radius:3px 3px 0 0;height:${h}px;
                    background:${isP?'var(--ss-amber)':d.v>0?'var(--ss-navy)':'var(--bg-3)'};
                    opacity:${d.v>0?1:0.4}"></div>
        <div style="font-size:8px;color:var(--ink-4)">${d.day}</div>
        <div style="font-size:8px;color:var(--ink-4);opacity:.7">${shP||''}</div>
      </div>`;
    }).join('');

    // SH performance bars
    const shBars = shRows.slice(0,20).map(r => {
      const w = Math.round(r.visits/maxSH*100);
      const pctV = total ? Math.round(r.visits/total*100) : 0;
      const teamColor = (r.team||'').toLowerCase()==='b2b'?'var(--b2b)':(r.team||'').toLowerCase()==='b2c'?'var(--good)':'var(--ink-3)';
      const sysDays = systemDaysFromDoj(r.doj);
      const attPct  = winDays ? Math.round(r.attDays/winDays*100) : 0;
      const attCol  = attPct>=80?'var(--good)':attPct>=50?'var(--ink-2)':'var(--danger)';
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)">
        <div style="width:120px;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${r.name}">${r.name}</div>
        <div style="font-size:10px;color:var(--ink-4);font-family:'JetBrains Mono',monospace;width:60px">${r.empCode||'—'}</div>
        <div style="width:52px">
          <span style="font-size:10px;font-weight:600;color:${teamColor};padding:2px 6px;background:${(r.team||'').toLowerCase()==='b2b'?'var(--b2b-soft)':'var(--good-soft)'};border-radius:4px">${r.team||'—'}</span>
        </div>
        <div style="width:48px;font-size:10px;color:var(--ink-4)">${r.category&&r.category!=='—'?r.category:'—'}</div>
        <div style="width:72px;font-size:10px;color:${sysDays!==null&&sysDays<=30?'var(--warn,#B45309)':'var(--ink-3)'};font-family:'JetBrains Mono',monospace"
             title="${sysDays!==null?sysDays+' days in system':'DOJ not available in current data feed'}">${r.doj||'—'}</div>
        <div style="width:56px;font-size:11px;font-weight:600;color:${attCol}" title="${r.attDays} of ${winDays} days in window · ${attPct}%">
          ${r.attDays}<span style="font-size:9px;font-weight:400;color:var(--ink-4)">/${winDays}</span>
        </div>
        <div style="width:40px;font-size:10px;color:var(--ink-3)" title="visits per attended day">${r.vPerAtt?r.vPerAtt.toFixed(1):'—'}</div>
        <div style="flex:1;height:7px;background:var(--bg-2);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${w}%;background:var(--ss-navy);border-radius:4px"></div>
        </div>
        <div style="font-size:12px;font-weight:700;color:var(--ink);width:28px;text-align:right">${r.visits}</div>
        <div style="font-size:11px;color:var(--ink-3);width:28px;text-align:right">${pctV}%</div>
      </div>`;
    }).join('');

    document.getElementById('ci-body').innerHTML = `
      ${backBtn}

      <!-- KPI strip -->
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px">${kpis}</div>

      <!-- type mix -->
      ${typeBreak.length ? `<div class="card" style="padding:20px;margin-bottom:18px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-bottom:14px">Visit type mix · ${st.selected}</div>
        <div style="display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap">${typePills}</div>
      </div>` : ''}

      <!-- daily bars -->
      <div class="card" style="padding:20px;margin-bottom:18px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)">Daily visits — ${st.selected}</div>
          <div style="font-size:10px;color:var(--ink-4)">🟡 = peak day · small number below bar = SH count</div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:2px;height:168px;padding-top:12px">${bars}</div>
      </div>

      <!-- SH breakdown -->
      ${shRows.length ? `<div class="card" style="padding:20px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-bottom:10px">
          SH breakdown · ${shRows.length} active · showing ${Math.min(shRows.length,20)}
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding:0 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px">

}

let clusterSHState = { cluster: "", sort: "totalCost", asc: false, emp: "" };

function renderClusterSH() {
  const all = DATA.shLevel || [];
  if (!all.length) {

        </div>
      </div>`;

function redrawClusterSH() {
  const all = DATA.shLevel || [];
  let rows = all.filter(r => r.cluster === clusterSHState.cluster);
  const q = (clusterSHState.emp || '').trim().toLowerCase();
  if (q) rows = rows.filter(r =>
    String(r.empCode || '').toLowerCase().includes(q) ||
    String(r.name || '').toLowerCase().includes(q)
  );
  rows.forEach(r => { r.sysDays = systemDaysFromDoj(r.doj); });

  // cluster aggregates
  const totalCost = rows.reduce((s,r) => s + (r.totalCost||0), 0);
  const totalVisits = rows.reduce((s,r) => s + (r.total||0), 0);
  const activeCount = rows.filter(r => r.group === 'active').length;
  const dumpOnlyCount = rows.filter(r => r.group === 'no_master').length;
  const zeroVisit = rows.filter(r => (r.total||0) === 0).length;
  const clusterCPV = totalVisits ? totalCost / totalVisits : 0;

  // ── Visit reconciliation: every visit lands in exactly one bucket ──────
  const vActive   = rows.filter(r => r.group === 'active').reduce((s,r)=>s+(r.total||0),0);
  const vInactive = rows.filter(r => r.group === 'inactive').reduce((s,r)=>s+(r.total||0),0);
  const vNoMaster = rows.filter(r => r.group === 'no_master').reduce((s,r)=>s+(r.total||0),0);
  const vTotal    = vActive + vInactive + vNoMaster;

  // New hire cost — per-SH when WebApp.gs sends it on shLevel (respects the
  // EMP filter), otherwise the cluster-level figure from Visits Analysis View.
  const cshCluster = (DATA.clusters||[]).find(c => c.cluster === clusterSHState.cluster);
  const perSH      = nhcPerSH();
  const cshNHC     = perSH ? rows.reduce((s,r) => s + nhcOf(r), 0) : nhcOf(cshCluster);
  const cshLive    = perSH || nhcHas(cshCluster) || nhcHas(DATA.totals);
  const newHires   = rows.filter(r => nhcOf(r) > 0);
  const nhVisits   = newHires.reduce((s,r) => s + (r.total||0), 0);
  const nhSource   = perSH ? 'per SH · respects the EMP filter' : 'cluster total from Visits Analysis View';

  document.getElementById("csh-summary").textContent =
    `${rows.length} people · ${activeCount} active · ${inr(vTotal)} visits · ₹${inrShort(totalCost)} cost`;

  document.getElementById("csh-kpi").innerHTML = `
    <div style="background:var(--ss-sky,#EEF4FB);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:22px;flex-wrap:wrap">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:600">Visit reconciliation</div>
      <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:20px;font-weight:700;color:var(--good)">${inr(vActive)}</span><span style="font-size:11px;color:var(--ink-3)">active</span></div>

      <span style="color:var(--ink-4)">+</span>
      <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:20px;font-weight:700;color:var(--warn,#B45309)">${inr(vNoMaster)}</span><span style="font-size:11px;color:var(--ink-3)">not in mastersheet</span></div>
      <span style="color:var(--ink-4)">=</span>
      <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:22px;font-weight:800;color:var(--ss-navy,#1A237E)">${inr(vTotal)}</span><span style="font-size:11px;color:var(--ink-3)">total visits</span></div>
    </div>
    <div class="grid-4" style="margin-bottom:0">
      <div class="cost-tile"><div class="lbl">Cluster total cost</div><div class="val">₹${inrShort(totalCost)}</div><div class="pct">${rows.length} people total</div></div>
      <div class="cost-tile"><div class="lbl">Cluster CPV</div><div class="val">₹${inr(clusterCPV)}</div><div class="pct">cost ÷ visits</div></div>
      <div class="cost-tile"><div class="lbl">Total visits</div><div class="val">${inr(vTotal)}</div><div class="pct">${activeCount} active SHs</div></div>
      <div class="cost-tile"><div class="lbl">Not in mastersheet</div><div class="val" style="color:${dumpOnlyCount > 0 ? 'var(--warn)' : 'var(--good)'}">${dumpOnlyCount}</div><div class="pct">${inr(vNoMaster)} visits, no salary</div></div>
      <div class="cost-tile"><div class="lbl">New hire cost</div><div class="val">${!cshLive ? '—' : '<span class="cur">₹</span>' + inrShort(cshNHC)}</div><div class="pct">${!cshLive ? 'needs newHireCost in payload' : cshNHC > 0 ? pct(cshNHC, totalCost) + ' of cluster cost' : 'no new hires this month'}</div></div>
      ${(() => {
        const sheetCpv = perSH ? null : nhcCpvSheet(cshCluster);
        const v = sheetCpv !== null ? sheetCpv : (vTotal > 0 ? cshNHC/vTotal : 0);
        return `<div class="cost-tile"><div class="lbl">NHC per visit</div><div class="val">${!cshLive ? '—' : '<span class="cur">₹</span>' + inr(Math.round(v))}</div><div class="pct">${!cshLive ? 'first-14-day SH cost' : (sheetCpv !== null ? 'from sheet · New Hire CPV' : 'of ₹' + inr(Math.round(clusterCPV)) + ' cluster CPV')}</div></div>`;
      })()}
    </div>

    ${!cshLive ? '' : `
    <!-- New-hire block — same three lines as the workbook, at cluster / filtered level -->
    <div style="margin-top:14px;display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden">
      <div style="padding:12px 18px;background:var(--ss-navy);min-width:190px">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ss-amber);font-weight:700">New hire SH</div>
        <div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:4px">${newHires.length ? inr(newHires.length) + (newHires.length===1?' person':' people') : (perSH ? 'none in this view' : 'cluster-level figure')}</div>
      </div>

        <div style="font-size:19px;font-weight:800;color:var(--ink)">₹${inr(Math.round(cshNHC))}</div>
      </div>
      <div style="padding:12px 18px;background:var(--warn-soft,#FEF9EC);border-right:1px solid var(--line);flex:1">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700">No of visit</div>
        <div style="font-size:19px;font-weight:800;color:var(--ink)">${inr(perSH ? nhVisits : vTotal)}</div>
        <div style="font-size:9.5px;color:var(--ink-4);margin-top:2px">${perSH ? 'by the new hires above' : 'all visits in cluster'}</div>
      </div>
      <div style="padding:12px 18px;background:var(--warn-soft,#FEF9EC);flex:1">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700">Cost attributed to new hires</div>
        <div style="font-size:19px;font-weight:800;color:var(--ss-navy)">₹${inr(Math.round(perSH ? (vTotal > 0 ? cshNHC/vTotal : 0) : (nhcCpvSheet(cshCluster) !== null ? nhcCpvSheet(cshCluster) : (vTotal > 0 ? cshNHC/vTotal : 0))))}</div>
        <div style="font-size:9.5px;color:var(--ink-4);margin-top:2px">per visit · ${nhSource}</div>
      </div>
    </div>`}
  `;

  // sort
  rows.sort((a,b) => {
    let va = a[clusterSHState.sort], vb = b[clusterSHState.sort];
    if (typeof va === "string") return clusterSHState.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    va = +va || 0; vb = +vb || 0;
    return clusterSHState.asc ? va - vb : vb - va;
  });

  const maxCost = Math.max(...rows.map(r => r.totalCost||0), 1);
  const cpvThreshold = clusterCPV * 1.5;

  const head = `<thead><tr>
    <th data-csh="empCode" style="text-align:left;padding:11px 14px;cursor:pointer">EMP Code</th>
    <th data-csh="name" style="text-align:left;padding:11px 14px;cursor:pointer">SH Name</th>
    <th data-csh="status" style="text-align:left;padding:11px 14px;cursor:pointer">Status</th>
    <th data-csh="team" style="text-align:left;padding:11px 14px;cursor:pointer">Team</th>
    <th data-csh="category" style="text-align:left;padding:11px 14px;cursor:pointer">Type</th>
    <th style="text-align:left;padding:11px 14px">DOJ</th>
    <th data-csh="sysDays" style="text-align:right;padding:11px 14px;cursor:pointer">DIS</th>
    <th data-csh="salary" style="text-align:right;padding:11px 14px;cursor:pointer">Salary</th>
    <th data-csh="toolkit" style="text-align:right;padding:11px 14px;cursor:pointer">Toolkit</th>
    <th data-csh="otherCost" style="text-align:right;padding:11px 14px;cursor:pointer">Other (20%)</th>
    <th data-csh="totalCost" style="text-align:right;padding:11px 14px;cursor:pointer">Total Cost</th>

    <th data-csh="total" style="text-align:right;padding:11px 14px;cursor:pointer">Visits</th>
    <th data-csh="cpv" style="text-align:right;padding:11px 14px;cursor:pointer">CPV</th>
  </tr></thead>`;

  // Build a row's HTML
  const rowHtml = (r) => {
    const isZero = (r.total||0) === 0;
    const highCpv = r.cpv > cpvThreshold && r.total > 0;
    const flag = isZero && r.group !== 'no_master' ? '<span class="chip bad">0 visits</span>'
               : highCpv ? '<span class="chip warn">high CPV</span>' : '';
    const inactive = (r.status||'').toLowerCase() !== 'active';
    const costBar = `<span class="barcell" style="width:50px"><i style="width:${((r.totalCost||0)/maxCost*100).toFixed(0)}%;background:${highCpv||isZero?'var(--danger)':'var(--accent)'}"></i></span>`;
    const sysDays = r.sysDays;
    const sysDaysColor = sysDays === null ? 'var(--ink-4)' : sysDays <= 30 ? 'var(--warn,#B45309)' : 'var(--ink-2)';
    return `<tr style="${isZero||highCpv ? 'background:linear-gradient(90deg,var(--danger-soft) 0%,transparent 50%)' : ''}">
      <td style="text-align:left;font-family:'JetBrains Mono',monospace;font-size:11px;color:${r.empCode?'var(--ink-2)':'var(--ink-4)'}">${r.empCode || '—'}${r.matchBy === 'name' ? '<span title="matched by name, no code" style="color:var(--warn);font-size:9px"> ~</span>' : ''}</td>
      <td style="text-align:left;font-weight:500">${r.name} ${flag}${r.splitCity ? '<span title="visits in this city; salary counted in home cluster" style="font-size:9px;color:var(--ink-3);font-weight:400;margin-left:4px">⤷ visits only</span>' : ''}</td>
      <td style="text-align:left"><span style="color:${inactive?'var(--ink-3)':'var(--good)'};font-size:11px">${r.status||'—'}</span></td>
      <td style="text-align:left;font-size:11px"><span class="chip ${(r.team||'').toLowerCase()==='b2b'?'b2b':''}">${r.team||'—'}</span></td>
      <td style="text-align:left;color:var(--ink-3);font-size:11px">${r.category||'—'}</td>
      <td style="text-align:left;color:var(--ink-3);font-size:11px;font-family:'JetBrains Mono',monospace">${r.doj || '—'}</td>
      <td style="text-align:right;font-weight:600;color:${sysDaysColor}">${sysDays !== null ? sysDays : '—'}</td>
      <td style="text-align:right">₹${inr(r.salary||0)}</td>
      <td style="text-align:right;color:var(--ink-3)">₹${inr(r.toolkit||0)}</td>
      <td style="text-align:right;color:var(--ink-3)">₹${inr(r.otherCost||0)}</td>
      <td style="text-align:right;font-weight:600">₹${inr(r.totalCost||0)}${costBar}</td>
      ${perSH ? `<td style="text-align:right">${nhcOf(r) > 0
          ? `<span class="chip warn" title="in first 14 days from DOJ">₹${inr(nhcOf(r))}</span>`
