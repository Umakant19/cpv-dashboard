      <td style="text-align:right">${r.cm||0}</td>
      <td style="text-align:right;font-weight:600">${r.total||0}</td>
      <td style="text-align:right">${r.cpv > 0 ? '<span class="chip '+(highCpv?'bad':r.cpv<clusterCPV*0.7?'good':'')+'">₹'+inr(r.cpv)+'</span>' : '—'}</td>
    </tr>`;
  };

  // Group definitions in display order (base = SH Daily All, grouped by status)
  const groups = [
    { key: 'active',    title: 'Active SHs',                  desc: 'Status Active in mastersheet · visits from SH Daily All' },
    { key: 'inactive',  title: 'Inactive SHs',                desc: 'Status not Active in mastersheet, but did visits this month' },
    { key: 'no_master', title: 'Not found in mastersheet',    desc: 'In SH Daily All by EMP Code, no matching mastersheet record' },
  ];

  const sectionsHtml = groups.map(g => {
    const grp = rows.filter(r => r.group === g.key);
    if (!grp.length) return '';
    const gVisits = grp.reduce((s,r)=>s+(r.total||0),0);
    const gCost = grp.reduce((s,r)=>s+(r.totalCost||0),0);
    const body = grp.map(rowHtml).join("");
    return `
      <div style="margin-top:22px">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
          <h3 style="margin:0;font-size:14px;color:var(--ink)">${g.title} <span style="color:var(--ink-3);font-weight:500">· ${grp.length}</span></h3>
          <span style="font-size:11px;color:var(--ink-3)">${g.desc}</span>
          <span style="margin-left:auto;font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace">${inr(gVisits)} visits · ₹${inrShort(gCost)}</span>
        </div>
        <div style="overflow-x:auto"><table id="tbl">${head}<tbody>${body}</tbody></table></div>
      </div>`;
  }).join("");

  document.getElementById("csh-tbl").innerHTML = sectionsHtml || '<p style="color:var(--ink-3);padding:20px">No SHs match this filter.</p>';

  document.querySelectorAll('#csh-tbl th[data-csh]').forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.csh;
      if (clusterSHState.sort === k) clusterSHState.asc = !clusterSHState.asc;
      else { clusterSHState.sort = k; clusterSHState.asc = false; }
      redrawClusterSH();
    });
  });
}

let pmState = { selected: 'ALL' };  // 'ALL' or a cluster name

function renderPMAdherence() {
  const clusters = (DATA.clusters || []).filter(c => (c.pmDue||0) > 0 || (c.pmDone||0) > 0);
  if (!clusters.length) {
    document.getElementById('app').innerHTML = '<div class="section" style="margin-top:0"><p style="color:var(--ink-3);padding:40px">No PM data available.</p></div>';
    return;
  }

  // ── Grand totals ──
  // ── multi-city selection state (default = all) ──
  const pmaAllCities = clusters.map(c=>c.cluster).sort((a,b)=>a.localeCompare(b));
  let  pmaSel = new Set(pmaAllCities);
  const pmaList = () => clusters.filter(c => pmaSel.has(c.cluster));

  function pmaTotals(list) {
    const G = {
      pmDue:     list.reduce((s,c)=>s+(c.pmDue||0),0),
      pmDone:    list.reduce((s,c)=>s+(c.pmDone||0),0),
      cm:        list.reduce((s,c)=>s+(c.cm||0),0),
      activeSH:  list.reduce((s,c)=>s+(c.activeShB2C||c.activeSH||0),0),
      forPM:     list.reduce((s,c)=>s+(c.forPM||0),0),
      totalCost: list.reduce((s,c)=>s+(c.totalCost||0),0),
      costPM:    list.reduce((s,c)=>s+(c.costPM||0),0),
      manDays:   list.reduce((s,c)=>s+(c.manDays||0),0),
      pmManDays: list.reduce((s,c)=>s+(c.pmManDays||0),0),
      pmTmAdj:   list.reduce((s,c)=>s+(c.pmTmAdj||0),0),
    };
    G.pctDone = G.pmDue > 0 ? (G.pmDone / G.pmDue * 100) : 0;
    G.balance = Math.max(0, G.pmDue - G.pmDone);
    G.cpvPM   = G.pmTmAdj   > 0 ? G.costPM / G.pmTmAdj  : 0;
    G.vDayPM  = G.pmManDays > 0 ? G.pmDone / G.pmManDays : 0;
    G.runRate = G.pmManDays > 0 ? G.pmDone / G.pmManDays : 0;
    const _mp = monthProgress();
    G.daysInMonth = _mp.daysInMonth;
    G.daysElapsed = _mp.elapsed;
    G.daysLeft    = _mp.remaining;      // real days remaining, from meta.asOf
    G.projClose = G.runRate > 0 ? G.balance / G.runRate : null;
    G.proj      = pmProjection(G.pmDue, G.pmDone);
    G.nCities   = list.length;
    return G;
  }
  const G = pmaTotals(clusters);

  function pmaTopHtml(G) { return `
      <!-- Grand total hero strip -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:28px;box-shadow:0 2px 8px rgba(26,35,126,.07)">

      ${(() => {

              <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-4);font-weight:700">Projected PM done</div>
              <div style="font-size:26px;font-weight:800;color:${col}">${inr(Math.round(P.projected))}</div>

              <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-4);font-weight:700">Pending at month end</div>

              <div style="height:100%;width:${Math.min(100,P.donePct).toFixed(1)}%;background:var(--good)" title="Done: ${inr(P.done)}"></div>
              <div style="height:100%;width:${Math.min(100-Math.min(100,P.donePct),Math.max(0,P.projPct-P.donePct)).toFixed(1)}%;background:var(--ss-amber);opacity:.75" title="Projected additional: ${inr(Math.round(P.projected-P.done))}"></div>
            </div>
            <div style="display:flex;gap:18px;margin-top:8px;font-size:10.5px;color:var(--ink-3);flex-wrap:wrap">
              <span><span class="swatch" style="background:var(--good)"></span>Done ${inr(P.done)} (${P.donePct.toFixed(1)}%)</span>
              <span><span class="swatch" style="background:var(--ss-amber)"></span>Projected further ${inr(Math.round(P.projected-P.done))}</span>
              <span><span class="swatch" style="background:#fff;border:1px solid var(--line)"></span>Expected shortfall ${inr(Math.round(P.projPending))}</span>
            </div>
          </div>
        </div>`;
      })()}
  `; }

  const html = `
    <div class="section" style="margin-top:0">
      <div class="eye">Field performance · ${DATA.meta.month||''}</div>
      <h2>PM Adherence & Completion</h2>
      <p class="lead">PM due vs done, balance, run rate, and projected close across all clusters. Click any cluster card to drill into its detail.</p>

      <div id="pma-top">${pmaTopHtml(G)}</div>

      <!-- City multi-select + cluster cards grid -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="position:relative">
            <button id="pma-city-btn" style="display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">
              <span id="pma-city-label">All cities (${pmaAllCities.length})</span>
              <span style="font-size:9px;color:var(--ink-4)">&#9660;</span>
            </button>
            <div id="pma-city-panel" style="display:none;position:absolute;z-index:60;top:calc(100% + 6px);left:0;width:270px;max-height:340px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(26,35,126,.16);padding:10px">
              <div style="display:flex;gap:6px;margin-bottom:8px;position:sticky;top:0;background:#fff;padding-bottom:6px">
                <button id="pma-city-all"  style="flex:1;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2)">Select all</button>
                <button id="pma-city-none" style="flex:1;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2)">Clear</button>
              </div>
              ${pmaAllCities.map(ct=>`
                <label style="display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink)">

                  <span>${ct}</span>
                </label>`).join('')}
            </div>
          </div>
          <div id="pma-count" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)">${clusters.length} Clusters — click to drill in</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:11px;color:var(--ink-4)">Sort:</span>
          ${['% done','balance','pmDue','runRate','projPending'].map(k=>
            `<button class="pma-sort" data-k="${k}" style="padding:4px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink-3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">${k==='% done'?'% Done':k==='balance'?'Balance':k==='pmDue'?'PM Due':k==='runRate'?'Run Rate':'Proj. Pending'}</button>`

    </div>

  document.getElementById('app').innerHTML = html;

  let pmSortKey = '% done', pmSortAsc = true;

  function renderPMACards() {
    const sorted = [...pmaList()].sort((a,b) => {
      const getV = (c) => {
        if (pmSortKey==='% done')   return c.pmDue>0 ? c.pmDone/c.pmDue : 0;
        if (pmSortKey==='balance')  return Math.max(0,(c.pmDue||0)-(c.pmDone||0));
        if (pmSortKey==='pmDue')    return c.pmDue||0;
        if (pmSortKey==='runRate')  return c.pmManDays>0 ? (c.pmDone||0)/c.pmManDays : 0;
        if (pmSortKey==='projPending') return pmProjection(c.pmDue, c.pmDone).projPending;
        return 0;
      };
      return pmSortAsc ? getV(a)-getV(b) : getV(b)-getV(a);
    });

    document.getElementById('pma-cards').innerHTML = sorted.map(c => {
      const due     = c.pmDue || 0;
      const done    = c.pmDone || 0;
      const pct     = due > 0 ? done/due*100 : 0;
      const bal     = Math.max(0, due - done);
      const shs     = c.activeShB2C || c.activeSH || 0;
      const forPM   = c.forPM || 0;
      const rr      = c.pmManDays > 0 ? done / c.pmManDays : 0;
      const cpvPM   = c.cpvPM || 0;
      const vdayPM  = c.vDayPM || 0;
      const cm      = c.cm || 0;
      // projection: SH-days needed to finish at current rate
      const projDays = rr > 0 ? (bal / rr / Math.max(forPM,1)).toFixed(1) : null;
      // month-end projection at this cluster's own calendar run rate
      const P = pmProjection(due, done);

      const pctColor = pct>=85?'var(--good)':pct>=70?'var(--ss-amber)':'var(--danger)';
      const barW     = Math.min(100, pct).toFixed(1);

      return `<div class="pma-cluster-card" data-cluster="${c.cluster}"
        style="background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(26,35,126,.05)">
        <!-- header -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div>
            <div style="font-size:15px;font-weight:800;color:var(--ss-navy)">${c.cluster}</div>
            <div style="font-size:10.5px;color:var(--ink-3);margin-top:2px">${shs} SHs · ${forPM} on PM</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:20px;font-weight:800;color:${pctColor}">${pct.toFixed(1)}%</div>
            <div style="font-size:10px;color:var(--ink-4)">completion</div>
          </div>
        </div>

        <!-- progress bar -->
        <div style="height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;margin-bottom:12px">
          <div style="height:100%;width:${barW}%;background:${pctColor};border-radius:4px"></div>
        </div>

        <!-- 6-metric grid -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <div style="background:var(--bg);border-radius:7px;padding:8px 10px">
            <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">PM Due</div>
            <div style="font-size:14px;font-weight:700;color:var(--ink)">${inr(Math.round(due))}</div>
          </div>
          <div style="background:var(--bg);border-radius:7px;padding:8px 10px">
            <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">PM Done</div>
            <div style="font-size:14px;font-weight:700;color:var(--good)">${inr(done)}</div>
          </div>
          <div style="background:var(--bg);border-radius:7px;padding:8px 10px">
            <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">Balance</div>
            <div style="font-size:14px;font-weight:700;color:${bal>0?'var(--danger)':'var(--good)'}">${inr(Math.round(bal))}</div>
          </div>
          <div style="background:var(--bg);border-radius:7px;padding:8px 10px">
            <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">Run Rate</div>
            <div style="font-size:14px;font-weight:700;color:var(--ss-navy)">${rr.toFixed(1)}</div>
            <div style="font-size:9px;color:var(--ink-4)">PM/SH-day</div>
          </div>
          <div style="background:var(--bg);border-radius:7px;padding:8px 10px">
            <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">CPV-PM</div>
            <div style="font-size:14px;font-weight:700;color:var(--ss-navy)">${cpvPM>0?'₹'+inr(Math.round(cpvPM)):'—'}</div>
          </div>
          <div style="background:var(--bg);border-radius:7px;padding:8px 10px">
            <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">V/Day PM</div>
            <div style="font-size:14px;font-weight:700;color:var(--ss-navy)">${vdayPM.toFixed(2)}</div>
          </div>
        </div>

        <!-- month-end projection -->
        <div style="margin-top:10px;padding:9px 11px;border-radius:7px;background:${P.projPending>0?'var(--danger-soft,#FEF2F2)':'var(--good-soft,#ECFDF5)'};border:1px solid ${P.projPending>0?'var(--danger)':'var(--good)'}">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700">Projected month end</div>
            <div style="font-size:10px;font-weight:700;color:${P.projPending>0?'var(--danger)':'var(--good)'}">${P.projPct.toFixed(0)}% of due</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px">
            <div style="font-size:10.5px;color:var(--ink-2)">${P.perDay.toFixed(1)}/day now · ${P.reqPerDay===Infinity?'—':P.reqPerDay.toFixed(1)}/day needed</div>
            <div style="font-size:13px;font-weight:800;color:${P.projPending>0?'var(--danger)':'var(--good)'}">${P.projPending>0?inr(Math.round(P.projPending))+' pending':'clears'}</div>
          </div>
        </div>

        <!-- projection footer -->
        <div style="margin-top:8px;padding-top:9px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:10.5px;color:var(--ink-3)">CM done: <b style="color:var(--ink)">${inr(cm)}</b></div>
          <div style="font-size:10.5px;color:${projDays&&+projDays<=5?'var(--good)':projDays&&+projDays<=12?'var(--warn)':'var(--danger)'}">
            ${projDays ? `~${projDays} days/SH to close` : 'no rate data'}
          </div>
        </div>

        <div style="margin-top:8px;font-size:10px;color:var(--ink-4);text-align:right">Tap for cluster detail →</div>
      </div>`;
    }).join('');

    // sort button states
    document.querySelectorAll('.pma-sort').forEach(btn => {
      const active = btn.dataset.k === pmSortKey;
      btn.style.background    = active ? 'var(--ss-navy)' : '#fff';
      btn.style.color         = active ? '#fff' : 'var(--ink-3)';
      btn.style.borderColor   = active ? 'var(--ss-navy)' : 'var(--line)';
    });

    // click → drill-down
    document.querySelectorAll('.pma-cluster-card').forEach(card => {
      card.addEventListener('mouseenter', () => { card.style.borderColor='var(--ss-amber)'; card.style.transform='translateY(-2px)'; card.style.boxShadow='0 4px 16px rgba(26,35,126,.12)'; });
      card.addEventListener('mouseleave', () => { card.style.borderColor='var(--line)'; card.style.transform=''; card.style.boxShadow='0 1px 4px rgba(26,35,126,.05)'; });
      card.addEventListener('click', () => renderPMACluster(card.dataset.cluster));
    });
  }

  // sort buttons
  document.querySelectorAll('.pma-sort').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pmSortKey === btn.dataset.k) pmSortAsc = !pmSortAsc;
      else { pmSortKey = btn.dataset.k; pmSortAsc = pmSortKey==='% done'; }
      renderPMACards();
    });
  });

  // ── city multi-select wiring ──
  function pmaRefresh() {
    const n = pmaSel.size;
    document.getElementById('pma-city-label').textContent =
      n === 0 ? 'No cities selected'
      : n === pmaAllCities.length ? `All cities (${n})`
      : n <= 3 ? [...pmaSel].sort().join(', ')
      : `${n} cities selected`;
    document.getElementById('pma-count').textContent =
      `${n} ${n===1?'Cluster':'Clusters'} — click to drill in`;
    document.getElementById('pma-top').innerHTML = pmaTopHtml(pmaTotals(pmaList()));
    renderPMACards();
  }

  const pmaBtn   = document.getElementById('pma-city-btn');
  const pmaPanel = document.getElementById('pma-city-panel');
  pmaBtn.addEventListener('click', e => {
    e.stopPropagation();
    pmaPanel.style.display = pmaPanel.style.display === 'none' ? 'block' : 'none';
  });
  pmaPanel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => { const p = document.getElementById('pma-city-panel'); if (p) p.style.display = 'none'; });

  document.querySelectorAll('.pma-city-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) pmaSel.add(cb.value); else pmaSel.delete(cb.value);
      pmaRefresh();
    });
  });
  document.getElementById('pma-city-all').addEventListener('click', () => {
    pmaSel = new Set(pmaAllCities);
    document.querySelectorAll('.pma-city-cb').forEach(cb => cb.checked = true);
    pmaRefresh();
  });
  document.getElementById('pma-city-none').addEventListener('click', () => {
    pmaSel = new Set();
    document.querySelectorAll('.pma-city-cb').forEach(cb => cb.checked = false);
    pmaRefresh();
  });

  renderPMACards();
}

// ── Cluster drill-down ────────────────────────────────────────────────────────
function renderPMACluster(clusterName) {
  const c = (DATA.clusters||[]).find(x=>x.cluster===clusterName);
  if (!c) return;

  const due    = c.pmDue || 0;
  const done   = c.pmDone || 0;
  const pct    = due > 0 ? done/due*100 : 0;
  const bal    = Math.max(0, due - done);
  const shs    = c.activeShB2C || c.activeSH || 0;
  const forPM  = c.forPM || 0;
  const forCM  = (c.forPmCm||0) - forPM;
  const rr     = c.pmManDays > 0 ? done / c.pmManDays : 0;
  const cpvPM  = c.cpvPM || 0;
  const cpvBld = c.cpvBlended || 0;
  const vdayPM = c.vDayPM || 0;
  const vdayBld= c.vDayBlended || 0;
  const cm     = c.cm || 0;
  const maas   = c.maas || 0;
  const b2b    = c.b2bVisits || 0;
  const torque = (c.torquePM||0) + (c.torqueCM||0);
  const totalV = c.totalVisits || 0;
  const projDays = rr > 0 ? (bal / rr / Math.max(forPM,1)).toFixed(1) : null;
  const pctColor = pct>=85?'var(--good)':pct>=70?'var(--ss-amber)':'var(--danger)';

  // SH-level data for this cluster
  const shRows = (DATA.shLevel||[])
    .filter(r=>r.cluster===clusterName && r.group!=='no_master')
    .map(r=>({
      name:r.name, empCode:r.empCode, status:r.status, team:r.team,
      category:r.category, pm:r.pm||0, cm:r.cm||0, total:r.total||0,
      salary:r.salary||0, totalCost:r.totalCost||0, cpv:r.cpv||0, splitCity:r.splitCity,
      doj: r.doj||''
    }))
    .sort((a,b)=>b.pm-a.pm);

  const shMax = shRows.length ? Math.max(...shRows.map(r=>r.pm),1) : 1;
  const shTotalPM = shRows.reduce((s,r)=>s+r.pm,0);

  const backBtn = `<button onclick="renderPMAdherence()"
    style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;
           background:#fff;color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:22px">
    ← All clusters
  </button>`;

  const kpis = [
    { lbl:'PM Due',         val:inr(Math.round(due)),          sub:'this month',          col:'var(--ink)' },
    { lbl:'PM Done',        val:inr(done),                     sub:`${pct.toFixed(1)}% complete`, col:'var(--good)' },
    { lbl:'Balance',        val:inr(Math.round(bal)),          sub:'still open',          col:bal>0?'var(--danger)':'var(--good)' },
    { lbl:'Run Rate',       val:rr.toFixed(2),                 sub:'PM visits/SH-day',    col:'var(--ss-navy)' },
    { lbl:'SH-days to close',val:projDays?inr(Math.round(projDays*forPM)):'—', sub:`at ${rr.toFixed(1)} rate`, col:projDays&&+projDays<=5?'var(--good)':'var(--warn)' },
    { lbl:'Active SHs',     val:shs,                           sub:`${forPM} on PM · ${forCM} CM`, col:'var(--ink)' },
    { lbl:'CPV — PM',       val:cpvPM>0?'₹'+inr(Math.round(cpvPM)):'—', sub:'cost÷adj.visits', col:'var(--ss-navy)' },
    { lbl:'V/Day PM',       val:vdayPM.toFixed(2),             sub:'PM÷PM man-days',      col:'var(--ss-navy)' },
  ].map(k=>`<div class="cost-tile" style="flex:1;min-width:130px">
    <div class="lbl">${k.lbl}</div>
    <div class="val" style="color:${k.col}">${k.val}</div>
    <div class="pct">${k.sub}</div>
  </div>`).join('');

  // Visit breakdown bars
  const visitTypes = [
    { label:'PM Done',  val:done,   color:'var(--good)' },
    { label:'CM',       val:cm,     color:'var(--ss-amber)' },
    { label:'MAAS',     val:maas,   color:'var(--b2b)' },
    { label:'B2B',      val:b2b,    color:'#5E35B1' },
    { label:'Torque',   val:torque, color:'var(--ink-3)' },
  ].filter(v=>v.val>0);
  const vtMax = Math.max(...visitTypes.map(v=>v.val),1);
  const visitBars = visitTypes.map(v=>`
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:80px;font-size:11.5px;font-weight:500;color:var(--ink)">${v.label}</div>
      <div style="flex:1;height:14px;background:var(--bg-2);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${(v.val/vtMax*100).toFixed(0)}%;background:${v.color};border-radius:4px"></div>
      </div>
      <div style="width:50px;text-align:right;font-size:12px;font-weight:700;color:var(--ink)">${inr(v.val)}</div>
      <div style="width:36px;text-align:right;font-size:11px;color:var(--ink-3)">${totalV?Math.round(v.val/totalV*100):0}%</div>
    </div>`).join('');

  // SH table rows
  const shTableRows = shRows.map(r=>{
    const teamColor = (r.team||'').toLowerCase()==='b2b'?'var(--b2b)':(r.team||'').toLowerCase()==='b2c'?'var(--good)':'var(--ink-3)';
    const pctOfCluster = shTotalPM>0?Math.round(r.pm/shTotalPM*100):0;
    const sysDays = systemDaysFromDoj(r.doj);
    const sysDaysColor = sysDays === null ? 'var(--ink-4)' : sysDays <= 30 ? 'var(--warn,#B45309)' : 'var(--ink-2)';
    return `<tr>
      <td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)">${r.empCode||'—'}</td>
      <td style="font-weight:600">${r.name}${r.splitCity?'<span style="font-size:9px;color:var(--ink-4);margin-left:4px">⤷ visits only</span>':''}</td>
      <td><span style="font-size:11px;font-weight:600;color:${teamColor}">${r.team||'—'}</span></td>
      <td style="color:var(--ink-3);font-size:11px">${r.category||'—'}</td>
      <td style="color:${(r.status||'').toLowerCase()==='active'?'var(--good)':'var(--ink-3)'};font-size:11px">${r.status||'—'}</td>
      <td style="text-align:right;font-weight:700;color:var(--good)">${inr(r.pm)}</td>
      <td style="text-align:right;color:var(--ink-3)">${inr(r.cm)}</td>
      <td style="text-align:right;font-weight:600">${inr(r.total)}</td>
      <td style="text-align:right">
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px">
          <div style="width:60px;height:5px;background:var(--bg-2);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${shMax>0?Math.round(r.pm/shMax*100):0}%;background:var(--good);border-radius:3px"></div>
          </div>
          <span style="font-size:10px;color:var(--ink-4);width:24px;text-align:right">${pctOfCluster}%</span>
        </div>
      </td>
      <td style="text-align:right;color:${r.cpv>cpvPM*1.4?'var(--danger)':r.cpv>0&&r.cpv<cpvPM*0.85?'var(--good)':'var(--ink-2)'};font-weight:600">${r.cpv>0?'₹'+inr(r.cpv):'—'}</td>
      <td style="text-align:left;font-size:10.5px;color:var(--ink-3);font-family:'JetBrains Mono',monospace">${r.doj || '—'}</td>
      <td style="text-align:right;font-size:11.5px;font-weight:600;color:${sysDaysColor}">${sysDays !== null ? sysDays : '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="section" style="margin-top:0">
      <div class="eye">PM Adherence · Cluster Detail</div>
      <h2>${clusterName}</h2>
      ${backBtn}

      <!-- KPI strip -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px">${kpis}</div>

      <!-- Completion bar -->
      <div class="card" style="padding:20px 22px;margin-bottom:22px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
          <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)">PM Completion — ${clusterName}</div>
          <div style="font-size:13px;font-weight:700;color:${pctColor}">${pct.toFixed(1)}% · ${inr(done)} of ${inr(Math.round(due))}</div>
        </div>
        <div style="height:14px;background:var(--bg-2);border-radius:7px;overflow:hidden">
          <div style="height:100%;width:${Math.min(100,pct).toFixed(1)}%;background:${pctColor};border-radius:7px;transition:width .4s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--ink-3)">
          <span>Balance: <b style="color:var(--danger)">${inr(Math.round(bal))}</b></span>
          <span>V/Day Blended: <b>${vdayBld.toFixed(2)}</b></span>
          <span>CPV Blended: <b>₹${inr(Math.round(cpvBld))}</b></span>
        </div>
      </div>

      <!-- Visit type breakdown -->
      <div class="card" style="padding:20px 22px;margin-bottom:22px">
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:14px">Visit breakdown — all types</div>
        <div style="display:flex;flex-direction:column;gap:10px">${visitBars}</div>
      </div>

      <!-- SH detail table -->
      <div class="tbl-wrap">
        <div class="tbl-head">
          <h3>SH-level PM detail — ${clusterName} (${shRows.length} people)</h3>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr>
              <th style="text-align:left">EMP Code</th>
              <th style="text-align:left">Name</th>
              <th style="text-align:left">Team</th>
              <th style="text-align:left">Category</th>
              <th style="text-align:left">Status</th>
              <th style="text-align:right">PM Done</th>
              <th style="text-align:right">CM</th>
              <th style="text-align:right">Total</th>
              <th style="text-align:right">PM share</th>
              <th style="text-align:right">CPV</th>
              <th style="text-align:left">DOJ</th>
              <th style="text-align:right">DIS</th>
            </tr></thead>
            <tbody>${shTableRows}</tbody>
          </table>
        </div>
      </div>
      <p style="font-size:11px;color:var(--ink-3);margin-top:8px">DIS = today − DOJ (from All SH Mastersheet). CPV flags &gt;140% of cluster avg in red, &lt;85% in green.</p>
    </div>
  `;
}


// ══════════════════════════════════════════════════════════════════════════════
// SH — OVERALL  ·  best-performing Service Heroes across the whole universe
// ══════════════════════════════════════════════════════════════════════════════
let shOverallState = { cities: null, from: 1, to: 0, team: 'All', type: 'All', sortKey: 'visits', asc: false, minVisits: 10 };

function renderSHOverall() {
  const unified     = DATA.shDailyUnified || [];
  const daysInMonth = DATA.meta.daysInMonth || 30;
  const types       = DATA.meta.types || ['PM','CM','MAAS','B2B','Torque'];
  const st          = shOverallState;
  if (!st.to) st.to = daysInMonth;

  if (!unified.length) {
    document.getElementById('app').innerHTML =
      '<div class="section" style="margin-top:0"><p style="color:var(--ink-3);padding:40px">No SH-level daily data available.</p></div>';
    return;
  }

  const allCities = [...new Set(unified.map(r => r.cluster).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if (!st.cities) st.cities = new Set(allCities);

  // SH master lookup (cost / team / status)
  const shMap = {};
  (DATA.shLevel || []).forEach(r => {
    const k = (r.empCode || r.name || '').toString().toLowerCase();
    if (!k) return;
    if (!shMap[k] || (r.totalCost||0) > (shMap[k].totalCost||0)) shMap[k] = r;
  });

  function buildRows() {
    const from = Math.min(st.from, st.to), to = Math.max(st.from, st.to);
    const winDays = to - from + 1;
    const rows = [];

    unified.forEach(r => {
      if (!st.cities.has(r.cluster)) return;

      let visits = 0, pm = 0, att = 0, peak = 0;
      const daily = [];
      for (let i = from - 1; i < to; i++) {
        let dv = 0;
        Object.keys(r.typeDays || {}).forEach(t => {
          if (st.type !== 'All' && t !== st.type) return;
          dv += (r.typeDays[t][i] || 0);
        });
        daily.push(dv);
        visits += dv;
        if (dv > 0) att++;
        if (dv > peak) peak = dv;
        if (r.typeDays && r.typeDays.PM) pm += (r.typeDays.PM[i] || 0);
      }
      if (visits <= 0) return;

      const meta = shMap[(r.empCode||'').toLowerCase()] || shMap[(r.name||'').toLowerCase()] || {};
      const team = meta.team || '—';
      if (st.team !== 'All' && team !== st.team) return;

      // pro-rate monthly cost across the selected window
      const cost = (meta.totalCost || 0) * (winDays / daysInMonth);
      const cpv  = visits > 0 && cost > 0 ? cost / visits : 0;

      // consistency = attended days as a share of the window
      const cons = winDays ? Math.round(att / winDays * 100) : 0;

      rows.push({
        name: r.name, empCode: r.empCode || '—', cluster: r.cluster,
        team, status: meta.status || '—',
        visits, pm, attDays: att, winDays,
        vday: att ? visits / att : 0,
        cons, peak, cpv, cost,
        pmShare: visits ? Math.round(pm / visits * 100) : 0
      });
    });
    return rows;
  }

  const sortDefs = [
    { k:'visits',  label:'Total Visits',   hi:true  },
    { k:'vday',    label:'Visits / Day',   hi:true  },
    { k:'attDays', label:'Attended Days',  hi:true  },
    { k:'cons',    label:'Consistency',    hi:true  },
    { k:'cpv',     label:'CPV (lowest)',   hi:false },
  ];

  const dayOpts = (sel) => Array.from({length:daysInMonth},(_,i)=>i+1)
    .map(d=>`<option value="${d}"${d===sel?' selected':''}>Day ${d}</option>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="section" style="margin-top:0">
      <div class="eye">Universe leaderboard · ${DATA.meta.month || ''}</div>
      <h2>SH — Overall</h2>
      <p class="lead">Top-performing Service Heroes across every city, ranked on volume, productivity, attendance, consistency and cost efficiency. Filter by city, date window, team or visit type to change the field.</p>

      <!-- controls -->
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;padding:16px 18px;background:var(--bg);border:1px solid var(--line);border-radius:12px">

        <div style="position:relative">
          <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);font-weight:700;margin-bottom:5px">City</div>
          <button id="so-city-btn" style="display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;min-width:180px;justify-content:space-between">
            <span id="so-city-label">All cities (${allCities.length})</span><span style="font-size:9px;color:var(--ink-4)">&#9660;</span>
          </button>
          <div id="so-city-panel" style="display:none;position:absolute;z-index:60;top:calc(100% + 6px);left:0;width:260px;max-height:320px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(26,35,126,.16);padding:10px">
            <div style="display:flex;gap:6px;margin-bottom:8px;position:sticky;top:0;background:#fff;padding-bottom:6px">
              <button id="so-city-all"  style="flex:1;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2)">Select all</button>
              <button id="so-city-none" style="flex:1;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2)">Clear</button>
            </div>
            ${allCities.map(ct=>`<label style="display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink)">
              <input type="checkbox" class="so-city-cb" value="${ct}"${st.cities.has(ct)?' checked':''} style="accent-color:var(--ss-navy);cursor:pointer"><span>${ct}</span></label>`).join('')}
          </div>
        </div>

        <div>
          <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);font-weight:700;margin-bottom:5px">From</div>
          <select id="so-from" style="padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer">${dayOpts(st.from)}</select>
        </div>
        <div>
          <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);font-weight:700;margin-bottom:5px">To</div>
          <select id="so-to" style="padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer">${dayOpts(st.to)}</select>
        </div>
        <div>
          <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);font-weight:700;margin-bottom:5px">Visit type</div>
          <select id="so-type" style="padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer">
            <option value="All"${st.type==='All'?' selected':''}>All types</option>
            ${types.map(t=>`<option value="${t}"${st.type===t?' selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div>
          <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);font-weight:700;margin-bottom:5px">Team</div>
          <select id="so-team" style="padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer">
            ${['All','B2C','B2B','Assure'].map(t=>`<option value="${t}"${st.team===t?' selected':''}>${t==='All'?'All teams':t}</option>`).join('')}
          </select>
        </div>
        <div>
          <div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);font-weight:700;margin-bottom:5px">Min visits</div>
          <select id="so-min" style="padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer">
            ${[0,5,10,25,50].map(n=>`<option value="${n}"${st.minVisits===n?' selected':''}>${n===0?'No floor':n+'+'}</option>`).join('')}
          </select>
        </div>
      </div>

      <!-- rank-by -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
        <span style="font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em">Rank by</span>
        ${sortDefs.map(s=>`<button class="so-sort" data-k="${s.k}" style="padding:5px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink-3);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit">${s.label}</button>`).join('')}
      </div>

      <div id="so-podium" style="margin-bottom:20px"></div>
      <div id="so-body"></div>
    </div>
  `;

  function render() {
    const rows = buildRows().filter(r => r.visits >= st.minVisits);
    const def  = sortDefs.find(s => s.k === st.sortKey) || sortDefs[0];

    // for CPV, zero means "no cost data" — push those to the bottom rather than the top
    const val = r => st.sortKey === 'cpv' ? (r.cpv > 0 ? r.cpv : Infinity) : (r[st.sortKey] || 0);
    const sorted = [...rows].sort((a,b) => st.asc ? val(a)-val(b) : val(b)-val(a));
    if (st.sortKey === 'cpv' && !st.asc) sorted.reverse(); // lowest CPV = best

    document.querySelectorAll('.so-sort').forEach(b => {
      const active = b.dataset.k === st.sortKey;
      b.style.background  = active ? 'var(--ss-navy)' : '#fff';
      b.style.color       = active ? '#fff' : 'var(--ink-3)';
      b.style.borderColor = active ? 'var(--ss-navy)' : 'var(--line)';
    });

    if (!sorted.length) {
      document.getElementById('so-podium').innerHTML = '';
      document.getElementById('so-body').innerHTML =
        '<p style="color:var(--ink-3);padding:30px 0">No Service Heroes match these filters.</p>';
      return;
    }

    // ── podium: top 3 ──
    const medal = ['🥇','🥈','🥉'];
    document.getElementById('so-podium').innerHTML =
      `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">` +
      sorted.slice(0,3).map((r,i) => `
        <div style="background:#fff;border:1.5px solid ${i===0?'var(--ss-amber)':'var(--line)'};border-radius:12px;padding:16px 18px;box-shadow:0 2px 10px rgba(26,35,126,.07)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
            <div style="min-width:0">
              <div style="font-size:14px;font-weight:800;color:var(--ss-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${r.name}">${r.name}</div>
              <div style="font-size:10.5px;color:var(--ink-3);margin-top:2px">${r.cluster} · ${r.team} · ${r.empCode}</div>
            </div>
            <div style="font-size:22px;line-height:1">${medal[i]}</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px">
            ${[['Visits', inr(r.visits)], ['Att. days', `${r.attDays}/${r.winDays}`],
               ['V/Day', r.vday.toFixed(1)], ['CPV', r.cpv>0?'₹'+inr(r.cpv):'—']]
              .map(([l,v])=>`<div>
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)">${l}</div>
                <div style="font-size:15px;font-weight:700;color:var(--ink)">${v}</div>
              </div>`).join('')}
          </div>
        </div>`).join('') + `</div>`;

    // ── leaderboard table ──
    const maxV = Math.max(...sorted.map(r => r.visits), 1);
    const shown = sorted.slice(0, 50);

    const head = ['#','Service Hero','EMP','City','Team','Visits','Att. Days','V/Day','Consist.','PM %','CPV'];
    const w    = ['32px','170px','66px','92px','54px','1fr','66px','52px','62px','48px','66px'];

    document.getElementById('so-body').innerHTML = `
      <div class="card" style="padding:20px;overflow-x:auto">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)">
            Leaderboard · ranked by ${def.label}
          </div>
          <div style="font-size:10.5px;color:var(--ink-4)">
            ${inr(rows.length)} SHs match · showing top ${shown.length} · days ${Math.min(st.from,st.to)}–${Math.max(st.from,st.to)}
          </div>
        </div>

        <div style="min-width:940px">
          <div style="display:flex;align-items:center;gap:8px;padding:0 0 7px;border-bottom:1px solid var(--line);margin-bottom:4px">
            ${head.map((h,i)=>`<div style="width:${w[i]};${w[i]==='1fr'?'flex:1;':''}font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4)">${h}</div>`).join('')}
          </div>
          ${shown.map((r,i) => {
            const bw = Math.round(r.visits / maxV * 100);
            const consCol = r.cons>=80?'var(--good)':r.cons>=50?'var(--ink-2)':'var(--danger)';
            const teamBg  = (r.team||'').toLowerCase()==='b2b' ? 'var(--b2b-soft)' : 'var(--good-soft)';
            const teamFg  = (r.team||'').toLowerCase()==='b2b' ? 'var(--b2b)' : 'var(--good)';
            return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)">
              <div style="width:32px;font-size:11px;font-weight:700;color:${i<3?'var(--ss-amber)':'var(--ink-4)'}">${i+1}</div>
              <div style="width:170px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${r.name}">${r.name}</div>
              <div style="width:66px;font-size:10px;color:var(--ink-4);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden">${r.empCode}</div>
              <div style="width:92px;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.cluster}</div>
              <div style="width:54px"><span style="font-size:9.5px;font-weight:600;color:${teamFg};padding:2px 6px;background:${teamBg};border-radius:4px">${r.team}</span></div>
              <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:120px">
                <div style="flex:1;height:7px;background:var(--bg-2);border-radius:4px;overflow:hidden">
                  <div style="height:100%;width:${bw}%;background:var(--ss-navy);border-radius:4px"></div>
                </div>
                <div style="font-size:12px;font-weight:700;color:var(--ink);width:38px;text-align:right">${inr(r.visits)}</div>
              </div>
              <div style="width:66px;font-size:11.5px;font-weight:600;color:var(--ink-2)">${r.attDays}<span style="font-size:9px;color:var(--ink-4)">/${r.winDays}</span></div>
              <div style="width:52px;font-size:12px;font-weight:700;color:var(--ink)">${r.vday.toFixed(1)}</div>
              <div style="width:62px;font-size:11.5px;font-weight:600;color:${consCol}">${r.cons}%</div>
              <div style="width:48px;font-size:11px;color:var(--ink-3)">${r.pmShare}%</div>
              <div style="width:66px;font-size:11.5px;font-weight:600;color:var(--ink-2)">${r.cpv>0?'₹'+inr(r.cpv):'—'}</div>
            </div>`;
          }).join('')}
        </div>
        <p style="font-size:10.5px;color:var(--ink-4);margin-top:12px">
          Att. Days = days in the window with at least one visit. V/Day = visits ÷ attended days.
          Consistency = attended days as a share of the window. CPV pro-rates monthly SH cost to the selected window; blank where cost isn't mapped.
        </p>
      </div>`;
  }

  // ── wiring ──
  function soRefresh() {
    const n = st.cities.size;
    document.getElementById('so-city-label').textContent =
      n === 0 ? 'No cities selected'
      : n === allCities.length ? `All cities (${n})`
      : n <= 2 ? [...st.cities].sort().join(', ')
      : `${n} cities selected`;
    render();
  }

  const soBtn = document.getElementById('so-city-btn');
  const soPan = document.getElementById('so-city-panel');
  soBtn.addEventListener('click', e => { e.stopPropagation(); soPan.style.display = soPan.style.display==='none'?'block':'none'; });
  soPan.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => { const p=document.getElementById('so-city-panel'); if(p) p.style.display='none'; });

  document.querySelectorAll('.so-city-cb').forEach(cb => cb.addEventListener('change', () => {
    if (cb.checked) st.cities.add(cb.value); else st.cities.delete(cb.value);
    soRefresh();
  }));
  document.getElementById('so-city-all').addEventListener('click', () => {
    st.cities = new Set(allCities);
    document.querySelectorAll('.so-city-cb').forEach(cb => cb.checked = true);
    soRefresh();
  });
  document.getElementById('so-city-none').addEventListener('click', () => {
    st.cities = new Set();
    document.querySelectorAll('.so-city-cb').forEach(cb => cb.checked = false);
    soRefresh();
  });

  document.getElementById('so-from').addEventListener('change', e => { st.from = +e.target.value; render(); });
  document.getElementById('so-to')  .addEventListener('change', e => { st.to   = +e.target.value; render(); });
  document.getElementById('so-type').addEventListener('change', e => { st.type = e.target.value;  render(); });
  document.getElementById('so-team').addEventListener('change', e => { st.team = e.target.value;  render(); });
  document.getElementById('so-min') .addEventListener('change', e => { st.minVisits = +e.target.value; render(); });

  document.querySelectorAll('.so-sort').forEach(b => b.addEventListener('click', () => {
    if (st.sortKey === b.dataset.k) st.asc = !st.asc;
    else { st.sortKey = b.dataset.k; st.asc = false; }
    render();
  }));

  soRefresh();
}

const RENDER = { overview: renderOverview, quadrant: renderQuadrant, clusters: renderClusters, shdaily: renderSHDaily, deepdive: renderDeepDive, cityiq: renderCityIQ, clustersh: renderClusterSH, pmadherence: renderPMAdherence, shoverall: renderSHOverall };
let currentTab = "overview";

function switchTab(name) {
  currentTab = name;
  if (!DATA) { showLoadError(currentMonthKey); return; }
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  destroyCharts();
  RENDER[name]();
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => switchTab(t.dataset.tab));
});

// ═════════════════════════════════════════════════════════════════════════════
// MONTH SWITCHING
// ═════════════════════════════════════════════════════════════════════════════
async function switchMonth(monthKey) {
  if (monthKey === currentMonthKey) return;
  currentMonthKey = monthKey;
  document.querySelectorAll(".month-tab").forEach(t => t.classList.toggle("active", t.dataset.month === monthKey));
  document.getElementById("app").innerHTML = `<div class="loading"><span class="spin"></span>Loading data…</div>`;
  const ok = await loadData(monthKey);
  if (!ok) { destroyCharts(); showLoadError(monthKey); return; }
  renderHeader();
  destroyCharts();
  RENDER[currentTab]();
}

document.querySelectorAll(".month-tab").forEach(t => {
  t.addEventListener("click", () => switchMonth(t.dataset.month));
});

// ═════════════════════════════════════════════════════════════════════════════
// BOOT
// ═════════════════════════════════════════════════════════════════════════════
(async () => {
  setChartDefaults();
  document.getElementById("app").innerHTML = `<div class="loading"><span class="spin"></span>Loading data…</div>`;
  const ok = await loadData(currentMonthKey);
  if (!ok) { showLoadError(currentMonthKey); return; }
  renderHeader();
  switchTab("overview");
})();
</script>
</body>
</html>
